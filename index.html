const NUGUL_H = 190;                 // 게임 속 누굴 키(px)
const NUGUL_ANCHOR_X = 165 / 344;    // 그림에서 몸통 가운데 위치 (오른쪽은 꼬리)

function drawBoss() {
  const b = state.boss;
  if (!b) return;
  ctx.save();
  const shake = b.hitFlash > 0 ? Math.sin(b.t * 80) * 6 : 0;
  ctx.translate(b.x + shake, b.y);
  if (b.dying) {                                   // 격파: 빙글빙글 돌며 작아짐
    const k = b.dying / 1.4;
    ctx.globalAlpha = Math.min(1, k * 2);
    ctx.translate(0, -80 * (1 - k));
    ctx.rotate((1 - k) * Math.PI * 4);
    ctx.scale(k, k);
  }
  if (b.hitFlash > 0) ctx.filter = "brightness(1.6)";
  drawNugul(b);
  ctx.filter = "none";
  ctx.restore();
}

function drawNugul(b) {
  const t = b.t;
  const hurt = b.hitFlash > 0 || b.dying;
  const H = NUGUL_H, Wd = H * NUGUL_IMG.width / NUGUL_IMG.height;
  const ax = Wd * NUGUL_ANCHOR_X;                     // 몸통 가운데 (꼬리 제외)

  // 뒤뚱뒤뚱 걸음 (부하 소환할 땐 깡총 점프)
  const jump = b.armUp > 0 ? Math.sin((0.8 - b.armUp) / 0.8 * Math.PI) * 40 : 0;
  // 넉백 중: 뒤로 젖혀지며 살짝 붕 떴다 착지
  const kb = b.kbLeft > 0 && b.kbTotal ? 1 - b.kbLeft / b.kbTotal : 1;
  const kbArc = b.kbLeft > 0 ? Math.sin(kb * Math.PI) * 26 : 0;
  const hop = Math.abs(Math.sin(t * 2.4)) * 6 + jump + kbArc;
  const tilt = Math.sin(t * 2.4) * 0.05 + (b.kbLeft > 0 ? 0.28 * Math.sin(kb * Math.PI) : 0);
  const squash = hurt ? 1 + Math.sin(t * 40) * 0.06 : 1 + Math.sin(t * 4.8) * 0.02;

  // 그림자
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.ellipse(0, 0, 80 - hop * 0.6, 13, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(0, -hop);
  ctx.rotate(tilt);
  ctx.scale(1 / squash, squash);
  if (NUGUL_IMG.complete && NUGUL_IMG.naturalWidth) {
    ctx.drawImage(NUGUL_IMG, -ax, -H, Wd, H);       // 보내준 원본 그림 그대로
  }

  // --- 아플 때 땀방울 ---
  if (hurt) {
    ctx.fillStyle = "#8fd3ff"; ctx.strokeStyle = "#2b1d16"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(66, -H * 0.86); ctx.quadraticCurveTo(78, -H * 0.76, 66, -H * 0.72); ctx.quadraticCurveTo(54, -H * 0.76, 66, -H * 0.86);
    ctx.fill(); ctx.stroke();
  }

  // --- 둔갑술: 머리 위 나뭇잎 ---
  if (b.leafLeft > 0) {
    ctx.save();
    ctx.translate(0, -H + 4);
    ctx.rotate(Math.sin(t * 6) * 0.15);
    ctx.fillStyle = "#6cc04a"; ctx.strokeStyle = "#2f6b22"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.quadraticCurveTo(-30, -10, 0, -38);
    ctx.quadraticCurveTo(30, -10, 0, 10);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, -30); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// --- 보스 문장 라벨 ---
function drawBossLabel() {
  const b = state.boss;
  if (!b || b.dying) return;
  const hidden = b.leafLeft > 0;
  const text = hidden ? "🍃 🍃 🍃 🍃 🍃" : b.sentences[b.idx];
  ctx.font = `24px ${FONT}`;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  const tw = ctx.measureText(text).width;
  const tag = `${b.idx + 1}/${b.sentences.length}`;
  ctx.font = `16px ${FONT}`;
  const tagW = ctx.measureText(tag).width + 16;
  const pw = tw + tagW + 34, ph = 40;
  let x = b.x - pw / 2;
  if (b.x < W) x = Math.max(6, Math.min(W - pw - 6, x));
  const y = b.y - 232;

  ctx.fillStyle = hidden ? "rgba(220,245,210,0.97)" : "rgba(255,248,235,0.97)";
  ctx.strokeStyle = hidden ? "#4f9a3a" : "#a0704c";
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 20); ctx.fill(); ctx.stroke();
  // 몇 번째 문장인지
  ctx.fillStyle = "#a0704c";
  ctx.beginPath(); ctx.roundRect(x + 8, y + 8, tagW, ph - 16, 12); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillText(tag, x + 16, y + ph / 2 + 1);
  ctx.font = `24px ${FONT}`;
  ctx.fillStyle = hidden ? "#4f9a3a" : "#5c3a26";
  ctx.fillText(text, x + tagW + 20, y + ph / 2 + 1);
  const hit = hidden ? 0 : matchCount(text, state.typing);
  if (hit > 0) {
    const done = text.slice(0, hit);
    ctx.fillStyle = "#ff4f8b";
    ctx.fillText(done, x + tagW + 20, y + ph / 2 + 1);
    ctx.fillRect(x + tagW + 20, y + ph - 8, ctx.measureText(done).width, 3);
  }
}

// --- 상단 보스 체력바 ---
function drawBossBar() {
  const b = state.boss;
  if (!b) return;
  const x = 484, y = 14, w = 324, h = 36;
  ctx.fillStyle = "rgba(255,248,235,0.92)";
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = "#a0704c"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#5c3a26";
  ctx.font = `18px ${FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("🦝 보스 누굴", x + 12, y + h / 2 + 1);
  // 문장 개수만큼 칸으로 나뉜 체력바
  const n = b.sentences.length, left = n - b.idx;
  const bx = x + 128, bw = w - 142, gap = 4, cw = (bw - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i < left ? "#ff7a59" : "#ead9c6";
    ctx.beginPath(); ctx.roundRect(bx + i * (cw + gap), y + 11, cw, 14, 7); ctx.fill();
  }
}

// --- 단어 라벨 ---
function drawLabel(m) {
  const scary = m.type === "fast" || m.type === "tank";
  const icy = m.type === "ice";
  const headY = { normal: -58, fast: -92, tank: -190, ice: -84 }[m.type];
  ctx.font = `22px ${FONT}`;
  ctx.textBaseline = "middle"; ctx.textAlign = "left";

  // 탱커는 "단어1 ▸ 단어2"로 표시, 이미 친 단어는 흐리게
  const parts = m.words.map((w, i) => ({ w, done: i < m.idx, now: i === m.idx }));
  const sep = " ▸ ";
  const hit = matchCount(m.words[m.idx], state.typing);     // 지금 치고 있는 글자와 몇 글자 일치?
  let total = 0;
  parts.forEach((p, i) => { total += ctx.measureText(p.w).width + (i ? ctx.measureText(sep).width : 0); });
  const pw = total + 26, ph = 34;
  let x = m.x - pw / 2;
  if (m.x < W) x = Math.max(6, Math.min(W - pw - 6, x));   // 긴 라벨이 화면 밖으로 잘리지 않게
  const y = m.y + headY - ph / 2;

  ctx.fillStyle = scary ? "rgba(25, 8, 20, 0.88)" : icy ? "rgba(230,247,255,0.95)" : "rgba(255,255,255,0.95)";
  ctx.strokeStyle = scary ? "#ff3b3b" : icy ? "#4fb3ff" : COLOR.outline;
  ctx.lineWidth = 3;
  if (hit > 0) {                                   // 조준 중인 몬스터: 반짝이는 노란 테두리
    ctx.save();
    ctx.shadowColor = "#ffd23a"; ctx.shadowBlur = 14;
    ctx.strokeStyle = "#ffcf3f"; ctx.lineWidth = 4;
  }
  ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 17); ctx.fill(); ctx.stroke();
  if (hit > 0) ctx.restore();

  x += 13;
  parts.forEach((p, i) => {
    if (i) {
      ctx.fillStyle = scary ? "#a05a5a" : "#b08a9a";
      ctx.fillText(sep, x, y + ph / 2 + 1);
      x += ctx.measureText(sep).width;
    }
    ctx.fillStyle = p.done ? "rgba(160,120,120,0.6)" : scary ? (p.now ? "#ff5c5c" : "#a06a6a") : COLOR.outline;
    ctx.fillText(p.w, x, y + ph / 2 + 1);
    if (p.now && hit > 0) {                        // 일치한 앞부분을 덧칠
      const done = p.w.slice(0, hit);
      ctx.fillStyle = scary ? "#ffd23a" : "#ff4f8b";
      ctx.fillText(done, x, y + ph / 2 + 1);
      ctx.fillRect(x, y + ph - 7, ctx.measureText(done).width, 3);
    }
    if (p.done) {                       // 취소선
      ctx.strokeStyle = "rgba(160,120,120,0.8)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y + ph / 2); ctx.lineTo(x + ctx.measureText(p.w).width, y + ph / 2); ctx.stroke();
    }
    x += ctx.measureText(p.w).width;
  });
}

function drawPuffs() {
  for (const p of state.puffs) {
    ctx.globalAlpha = Math.max(0, p.life / 0.5) * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- 밤: 어둑한 하늘 + 반짝이는 별 + 졸린 달 ---
const NIGHT_STARS = Array.from({ length: 35 }, () => ({ x: Math.random() * 960, y: Math.random() * 330, p: Math.random() * 6 }));
function drawNight() {
  const n = state.night;
  if (n < 0.01) return;
  ctx.fillStyle = `rgba(27, 29, 74, ${n * 0.5})`;
  ctx.fillRect(0, 0, W, H);
  for (const st of NIGHT_STARS) {
    ctx.globalAlpha = n * (0.5 + Math.sin(state.time * 3 + st.p) * 0.5);
    drawStar(st.x, st.y, 3, "#fff7c2");
  }
  // 달 (해 자리에서 떠오름)
  ctx.globalAlpha = n;
  const mx = 860, my = 90 + (1 - n) * 60;
  ctx.save();
  ctx.shadowColor = "#fff3b0"; ctx.shadowBlur = 30;
  ctx.fillStyle = "#fff6cf";
  ctx.beginPath(); ctx.arc(mx, my, 38, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "rgba(220, 200, 140, 0.5)";       // 크레이터
  [[-14, -14, 6], [16, 12, 5], [-18, 14, 4]].forEach(([dx, dy, r]) => {
    ctx.beginPath(); ctx.arc(mx + dx, my + dy, r, 0, Math.PI * 2); ctx.fill();
  });
  drawFace(mx, my, 28, { closed: true });           // 졸린 달
  ctx.font = `18px ${FONT}`; ctx.fillStyle = "#fff6cf"; ctx.textAlign = "left";
  ctx.fillText("z", mx + 34, my - 30 - Math.sin(state.time * 2) * 4);
  ctx.fillText("Z", mx + 46, my - 46 - Math.sin(state.time * 2 + 1) * 4);
  ctx.globalAlpha = 1;
}

// --- 얼음 정령: 잡으면 이득인 착한 몬스터라 귀엽게 ---
function drawIceSpirit(m) {
  const t = m.t;
  const fy = -40 + Math.sin(t * 3) * 6;          // 둥실둥실 떠다님
  ctx.fillStyle = "rgba(79,179,255,0.18)";
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 쌩~ 지나가는 얼음 꼬리 (가장 빠른 몬스터라는 표시)
  for (let i = 1; i <= 4; i++) {
    ctx.globalAlpha = 0.25 - i * 0.05;
    ctx.fillStyle = "#bfe9ff";
    ctx.beginPath(); ctx.ellipse(i * 16, fy - Math.sin((t - i * 0.05) * 3) * 6 + Math.sin(t * 3) * 6, 18 - i * 3, 14 - i * 2.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 4; i++) {
    const off = (t * 300 + i * 30) % 90;
    drawStar(24 + off, fy - 20 + i * 12, 3, `rgba(255,255,255,${1 - off / 90})`);
  }
  ctx.save();
  ctx.translate(0, fy);
  ctx.shadowColor = "#9fdcff"; ctx.shadowBlur = 16;
  const g = ctx.createLinearGradient(-24, -30, 24, 30);
  g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#8fd3ff");
  ctx.fillStyle = g;
  ctx.strokeStyle = "#3d8fd1"; ctx.lineWidth = 3;
  ctx.beginPath();                                 // 다이아몬드 결정
  ctx.moveTo(0, -32); ctx.lineTo(24, -6); ctx.lineTo(0, 30); ctx.lineTo(-24, -6); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(0, fy);
  ctx.strokeStyle = "rgba(61,143,209,0.4)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-24, -6); ctx.lineTo(24, -6); ctx.moveTo(0, -32); ctx.lineTo(-8, -6); ctx.lineTo(0, 30); ctx.stroke();
  drawFace(0, 2, 18, {});
  // 주변 반짝이
  for (let i = 0; i < 3; i++) {
    const a = t * 2 + i * 2.1;
    drawStar(Math.cos(a) * 34, Math.sin(a) * 22 - 4, 4, "#ffffff");
  }
  ctx.restore();
}

// --- 얼음 효과 중 화면 ---
function drawFreeze() {
  if (state.freezeTimer <= 0) return;
  const a = Math.min(1, state.freezeTimer) * 0.22;
  ctx.fillStyle = `rgba(150, 215, 255, ${a})`;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 25; i++) {                  // 눈송이
    const x = (i * 97 + state.time * 30) % W;
    const y = (i * 53 + state.time * 60) % H;
    ctx.globalAlpha = Math.min(1, state.freezeTimer);
    drawStar(x, y, 4, "#ffffff");
  }
  ctx.globalAlpha = 1;
}

// --- 착지 충격파 ---
function drawRings() {
  for (const r of state.rings) {
    ctx.strokeStyle = `rgba(255, 90, 120, ${r.life})`;
    ctx.lineWidth = 10 * r.life;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

// --- 떠오르는 글자 (+5G, -10, 쾅!!) ---
function drawFloats() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const f of state.floats) {
    const big = f.text.startsWith("쿠웅");
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `${big ? 72 : 24}px ${FONT}`;
    ctx.lineWidth = big ? 10 : 5; ctx.lineJoin = "round";
    ctx.strokeStyle = "#fff";
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// --- 성에서 날아가는 하트 ---
function drawShots() {
  for (const h of state.shots) {
    const k = Math.min(1, h.t / 0.18);                       // 날아가는 진행도
    const pos = kk => ({
      x: h.x0 + (h.x1 - h.x0) * kk,
      y: h.y0 + (h.y1 - h.y0) * kk - Math.sin(kk * Math.PI) * (h.tier === 3 ? 110 : 60)
    });
    const p = pos(k);
    const after = Math.max(0, h.t - 0.18);                    // 맞은 뒤 흐른 시간
    ctx.save();

    if (h.tier === 0) {                                       // 💗 하트
      ctx.globalAlpha = 1 - Math.min(1, after / 0.04);
      drawHeart(p.x, p.y, 9, "#ff4f8b");
    }

    else if (h.tier === 1) {                                  // ⭐ 별빛: 빙글 도는 별 + 꼬리 + 맞으면 별 폭죽
      if (k < 1) {
        for (let i = 4; i >= 1; i--) {
          const q = pos(Math.max(0, k - i * 0.07));
          ctx.globalAlpha = 0.5 - i * 0.1;
          drawStar(q.x, q.y, 11 - i * 1.5, "#fff3a0");
        }
        ctx.globalAlpha = 1;
        ctx.translate(p.x, p.y); ctx.rotate(h.t * 25);
        ctx.shadowColor = "#ffd23a"; ctx.shadowBlur = 12;
        drawStar(0, 0, 18, "#ffd23a");
        drawStar(0, 0, 8, "#fff");
      } else {
        const r = 14 + after * 320;
        ctx.globalAlpha = 1 - after / 0.14;
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          drawStar(h.x1 + Math.cos(a) * r, h.y1 + Math.sin(a) * r, 9, i % 2 ? "#ffd23a" : "#fff");
        }
      }
    }

    else if (h.tier === 2) {                                  // 🌈 무지개 빔: 성에서 한 줄기 레이저
      const fade = 1 - h.t / h.life;
      const g = ctx.createLinearGradient(h.x0, h.y0, h.x1, h.y1);
      ["#ff5c7a", "#ffa94d", "#ffe066", "#7bd88f", "#4fb3ff", "#c9a7ff"].forEach((c, i) => g.addColorStop(i / 5, c));
      ctx.globalAlpha = fade;
      ctx.shadowColor = "#fff"; ctx.shadowBlur = 16;
      ctx.strokeStyle = g; ctx.lineCap = "round";
      ctx.lineWidth = 16 * fade + 2;
      ctx.beginPath(); ctx.moveTo(h.x0, h.y0); ctx.lineTo(h.x1, h.y1); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 4 * fade + 1;
      ctx.beginPath(); ctx.moveTo(h.x0, h.y0); ctx.lineTo(h.x1, h.y1); ctx.stroke();
      ctx.shadowBlur = 0;
      for (let i = 0; i < 6; i++) {                           // 빔 위 반짝이
        const s = (i / 6 + h.t * 3) % 1;
        drawStar(h.x0 + (h.x1 - h.x0) * s, h.y0 + (h.y1 - h.y0) * s + Math.sin(i * 7) * 10, 5, "#fff");
      }
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;              // 명중 고리
      ctx.beginPath(); ctx.arc(h.x1, h.y1, 10 + h.t * 160, 0, Math.PI * 2); ctx.stroke();
    }

    else {                                                    // ☄️ 황금 유성: 불꼬리 + 쾅 폭발
      if (k < 1) {
        for (let i = 6; i >= 1; i--) {
          const q = pos(Math.max(0, k - i * 0.05));
          ctx.globalAlpha = 0.6 - i * 0.08;
          ctx.fillStyle = i > 3 ? "#ff7a3d" : "#ffb347";
          ctx.beginPath(); ctx.arc(q.x, q.y, 16 - i * 1.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        const rg = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 18);
        rg.addColorStop(0, "#fff"); rg.addColorStop(0.4, "#ffe066"); rg.addColorStop(1, "#ff7a3d");
        ctx.shadowColor = "#ffb000"; ctx.shadowBlur = 24;
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
      } else {
        if (!h.boomed) {                                      // 명중 순간 한 번만
          h.boomed = true;
          addPuff(h.x1, h.y1, 10, "#ffb347");
          addFloat(h.x1, h.y1 - 60, "크리티컬!", "#ff7a3d");
          state.shake = Math.max(state.shake, 0.18);
        }
        const r = 14 + after * 420;
        ctx.globalAlpha = Math.max(0, 1 - after / 0.2);
        ctx.strokeStyle = "#ffcf3f"; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.ellipse(h.x1, h.y1, r, r * 0.6, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#ff7a3d"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(h.x1, h.y1, r * 0.7, r * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// --- 콤보 표시 (입력창 위) ---
function drawCombo() {
  if (state.combo < 2 || state.phase !== "playing") return;
  const pop = 1 + Math.max(0, state.comboPop) * 1.6;
  ctx.save();
  ctx.translate(W - 130, 162);                     // 오른쪽 하늘 (달 아래)
  ctx.scale(pop, pop);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.font = `28px ${FONT}`;
  ctx.lineWidth = 7; ctx.strokeStyle = "#fff";
  const text = `🔥 ${state.combo} 콤보!`;
  ctx.strokeText(text, 0, 0);
  ctx.fillStyle = state.combo >= 10 ? "#ff3b6b" : "#ff7a3d";
  ctx.fillText(text, 0, 0);
  ctx.font = `15px ${FONT}`; ctx.lineWidth = 5;
  const atk = ATTACKS[attackTier(state.combo)];
  const sub = `${atk.icon} ${atk.name} · 골드 +${Math.round((comboBonus() - 1) * 100)}%`;
  ctx.strokeText(sub, 0, 24); ctx.fillStyle = "#c98a00"; ctx.fillText(sub, 0, 24);
  ctx.restore();
}

function drawFlash() {
  if (state.flash <= 0) return;
  ctx.fillStyle = `rgba(255,255,255,${state.flash * 2})`;
  ctx.fillRect(0, 0, W, H);
}

// --- 가운데 큰 안내 문구 (웨이브 시작 / 클리어) ---
function drawBanner() {
  const b = state.banner;
  if (!b) return;
  const a = Math.min(1, b.t * 2);
  const pop = 1 + Math.max(0, b.t - 1.4) * 1.5;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(W / 2, 200);
  ctx.scale(pop, pop);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  ctx.font = `60px ${FONT}`;
  ctx.lineWidth = 12; ctx.strokeStyle = COLOR.roofDark;
  ctx.strokeText(b.text, 0, 0);
  ctx.fillStyle = "#fff"; ctx.fillText(b.text, 0, 0);
  if (b.sub) {
    ctx.font = `26px ${FONT}`;
    ctx.lineWidth = 7; ctx.strokeText(b.sub, 0, 50);
    ctx.fillText(b.sub, 0, 50);
  }
  ctx.restore();
}

// --- 체력바 옆 미니 성: 성벽 강화 단계에 따라 작은 성 → 큰 성 ---
//   0단계: 탑 하나짜리 작은 성 / 1: 깃발 / 2: 양옆 탑 + 리본 / 3: 왕관 / 4: 전구 / 5~: 반짝이 + 최대 크기
function drawMiniCastle(cx, baseY, lv) {
  const L = Math.min(lv, 5);
  const s = 16 + L * 2.8;                         // 성 크기: 16px → 30px
  const bw = s, bh = s * 0.62;
  const top = baseY - bh;
  ctx.save();
  ctx.lineWidth = 1.6; ctx.strokeStyle = COLOR.outline; ctx.lineJoin = "round";

  // 양옆 작은 탑 (2단계부터)
  if (L >= 2) {
    for (const sx of [-1, 1]) {
      const twx = cx + sx * bw * 0.42, tw = s * 0.26, th = bh * 1.15;
      ctx.fillStyle = COLOR.tower;
      ctx.fillRect(twx - tw / 2, baseY - th, tw, th); ctx.strokeRect(twx - tw / 2, baseY - th, tw, th);
      ctx.fillStyle = COLOR.roof;
      ctx.beginPath(); ctx.moveTo(twx - tw / 2 - 2, baseY - th); ctx.lineTo(twx, baseY - th - s * 0.3); ctx.lineTo(twx + tw / 2 + 2, baseY - th); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  // 본체
  ctx.fillStyle = COLOR.wall;
  ctx.beginPath(); ctx.roundRect(cx - bw / 2, top, bw, bh, 2); ctx.fill(); ctx.stroke();
  // 성문
  ctx.fillStyle = "#c98f6b";
  ctx.beginPath(); ctx.roundRect(cx - s * 0.11, baseY - bh * 0.5, s * 0.22, bh * 0.5, [s * 0.11, s * 0.11, 0, 0]); ctx.fill();
  // 가운데 탑
  const tw = s * 0.36, th = bh * 0.85, tTop = top - th;
  ctx.fillStyle = COLOR.tower;
  ctx.fillRect(cx - tw / 2, tTop, tw, th + 1); ctx.strokeRect(cx - tw / 2, tTop, tw, th);
  ctx.fillStyle = COLOR.roof;
  const roofTip = tTop - s * 0.42;
  ctx.beginPath(); ctx.moveTo(cx - tw / 2 - 3, tTop); ctx.lineTo(cx, roofTip); ctx.lineTo(cx + tw / 2 + 3, tTop); ctx.closePath(); ctx.fill(); ctx.stroke();

  // 1단계: 깃발
  if (L >= 1 && L < 3) {
    ctx.beginPath(); ctx.moveTo(cx, roofTip); ctx.lineTo(cx, roofTip - s * 0.3); ctx.stroke();
    ctx.fillStyle = "#7fd6c2";
    ctx.beginPath(); ctx.moveTo(cx, roofTip - s * 0.3); ctx.lineTo(cx + s * 0.28, roofTip - s * 0.22); ctx.lineTo(cx, roofTip - s * 0.13); ctx.closePath(); ctx.fill();
  }
  // 2단계: 리본
  if (L >= 2) drawHeart(cx, top + bh * 0.28, s * 0.09, "#ff5c8a");
  // 3단계: 왕관
  if (L >= 3) {
    const cw = s * 0.42, cy = roofTip - 1;
    ctx.fillStyle = "#ffcf3f";
    ctx.beginPath();
    ctx.moveTo(cx - cw / 2, cy); ctx.lineTo(cx - cw / 2, cy - cw * 0.55); ctx.lineTo(cx - cw / 4, cy - cw * 0.25);
    ctx.lineTo(cx, cy - cw * 0.7); ctx.lineTo(cx + cw / 4, cy - cw * 0.25); ctx.lineTo(cx + cw / 2, cy - cw * 0.55); ctx.lineTo(cx + cw / 2, cy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 4단계: 전구
  if (L >= 4) {
    ["#ff5c8a", "#ffd23a", "#7fd6c2", "#c9a7ff"].forEach((c, i) => {
      ctx.globalAlpha = 0.6 + 0.4 * Math.max(0, Math.sin(state.time * 4 + i));
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(cx - bw * 0.36 + i * bw * 0.24, top + 3, 1.8, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  // 5단계 이상: 반짝이
  if (L >= 5) {
    for (let i = 0; i < 3; i++) {
      const a = state.time * 1.5 + i * 2.1;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(state.time * 5 + i);
      drawStar(cx + Math.cos(a) * s * 0.7, baseY - bh + Math.sin(a) * s * 0.5, 3, "#ffd23a");
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// 글자가 칸보다 길면 글자 크기를 줄여서 칸 안에 맞춤 (폰트·숫자 길이와 상관없이 안 넘치게)
function fitText(text, x, y, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  while (size > 11 && ctx.measureText(text).width > maxW) { size -= 1; ctx.font = `${size}px ${FONT}`; }
  ctx.fillText(text, x, y);
}

function drawHUD() {
  if (state.phase === "ending" || state.phase === "prologue") return;            // 엔딩 땐 화면을 깔끔하게
  if (state.phase === "title") {
    // 통통 튀는 제목
    const bounce = Math.abs(Math.sin(state.time * 2)) * -6;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `48px ${FONT}`;
    ctx.lineJoin = "round"; ctx.lineWidth = 10;
    ctx.strokeStyle = COLOR.roofDark;
    const TITLE = "타자 치기 게임";                  // 시작 화면 제목
    ctx.strokeText(TITLE, W / 2, 58 + bounce);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(TITLE, W / 2, 58 + bounce);
    const hx = ctx.measureText(TITLE).width / 2 + 30;  // 제목 길이에 맞춰 양옆 하트 위치
    drawHeart(W / 2 + hx, 52 + bounce, 11, COLOR.roofDark);
    drawHeart(W / 2 - hx, 52 + bounce, 11, COLOR.roofDark);
    return;
  }

  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = `19px ${FONT}`;

  // 웨이브 · 처치 · 골드
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.roundRect(62, 14, 260, 36, 18); ctx.fill();
  ctx.fillStyle = COLOR.outline;
  fitText(`🌙 ${state.wave}일째 밤  👾 ${state.kills}  💰 ${state.gold}G`, 76, 33, 232, 19);

  // 미니 성 자리 (왼쪽, 두 줄 높이) — 성벽 강화할수록 작은 성 → 큰 성
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.roundRect(12, 14, 44, 72, 16); ctx.fill();
  drawMiniCastle(34, 80, state.wallLevel || 0);

  // 성 체력바
  const ratio = state.hp / state.maxHp;
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.roundRect(62, 56, 260, 30, 15); ctx.fill();
  ctx.fillStyle = "#f3d9e3";
  ctx.beginPath(); ctx.roundRect(76, 64, 166, 14, 7); ctx.fill();
  ctx.fillStyle = ratio > 0.5 ? "#7bd88f" : ratio > 0.25 ? "#ffc94d" : "#ff5c7a";
  if (ratio > 0) { ctx.beginPath(); ctx.roundRect(76, 64, 166 * ratio, 14, 7); ctx.fill(); }
  ctx.fillStyle = COLOR.outline;
  fitText(`${state.hp}/${state.maxHp}`, 250, 72, 64, 16);

  // 남은 몬스터
  if (state.phase === "playing") {
    const left = state.toSpawn + state.monsters.filter(m => !m.dying && isMonster(m)).length;   // 얼음 정령 제외
    drawBossBar();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath(); ctx.roundRect(330, 14, 146, 36, 18); ctx.fill();
    ctx.fillStyle = COLOR.outline;
    fitText(`남은 몬스터 ${left}`, 344, 33, 120, 16);
    // 실시간 타수
    const cpm = getStats().cpm;
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath(); ctx.roundRect(330, 56, 146, 30, 15); ctx.fill();
    ctx.fillStyle = COLOR.outline;
    fitText(cpm ? `⌨️ ${cpm}타/분` : "⌨️ 타수 측정 중", 344, 72, 120, 16);
  }

  // 필살기 게이지 (오른쪽 아래)
  const ready = state.skillLeft <= 0 && !state.skill.active;
  const sx = W - 216, sy = H - 50;
  ctx.fillStyle = ready ? "#ff5c8a" : "rgba(255,255,255,0.85)";
  ctx.beginPath(); ctx.roundRect(sx, sy, 200, 38, 19); ctx.fill();
  if (!ready && !state.skill.active) {
    const k = 1 - state.skillLeft / state.skillCooldown;
    ctx.fillStyle = "rgba(255, 92, 138, 0.35)";
    ctx.beginPath(); ctx.roundRect(sx, sy, 200 * k, 38, 19); ctx.fill();
  }
  if (ready) {                                      // 준비되면 반짝반짝
    ctx.strokeStyle = `rgba(255,255,255,${0.5 + Math.sin(state.time * 6) * 0.5})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(sx, sy, 200, 38, 19); ctx.stroke();
  }
  ctx.fillStyle = ready ? "#fff" : COLOR.outline;
  ctx.font = `18px ${FONT}`;
  ctx.textAlign = "center";
  ctx.fillText(ready ? "😡 '살려줘' 준비 완료!" :
               state.skill.active ? "😡 분노 폭발 중!!" : `😡 살려줘 ${Math.ceil(state.skillLeft)}초`,
               sx + 100, sy + 20);
}

// =====================================================================
//  🦝 보스 등장 컷인 — 화면이 잠깐 멈추고 누굴이 크게 휙 지나감
//   0.0s 번쩍 + 화면 어두워짐 → 사선 띠가 쓱 → 누굴 등장(통통) + 이름 → 1.8s 휙 퇴장
// =====================================================================
const CUTIN_TIME = 2.4;
const easeOutBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);
const clamp01 = v => Math.max(0, Math.min(1, v));

function startCutin() {
  state.cutin = { t: 0 };
  state.flash = Math.max(state.flash, 0.25);
}

function drawCutin() {
  const c = state.cutin;
  if (!c) return;
  const t = c.t;
  const inK = clamp01(t / 0.35);                        // 들어오는 정도
  const outK = clamp01((t - 1.9) / 0.4);                // 나가는 정도
  ctx.save();

  // 1) 화면 어둡게
  ctx.fillStyle = `rgba(30, 10, 30, ${0.55 * inK * (1 - outK)})`;
  ctx.fillRect(0, 0, W, H);

  // 2) 사선 띠 (오른쪽에서 쓱 들어왔다가 왼쪽으로 쓱)
  const slide = (1 - easeOutBack(inK)) * W - outK * W * 1.3;
  ctx.save();
  ctx.translate(slide, 0);
  const g = ctx.createLinearGradient(0, 150, 0, 400);
  g.addColorStop(0, "#ff7aa8"); g.addColorStop(1, "#ffb36b");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-60, 175); ctx.lineTo(W + 60, 125); ctx.lineTo(W + 60, 375); ctx.lineTo(-60, 425);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-60, 175); ctx.lineTo(W + 60, 125); ctx.moveTo(-60, 425); ctx.lineTo(W + 60, 375); ctx.stroke();
  // 속도선
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 3;
  for (let i = 0; i < 14; i++) {
    const yy = 175 + i * 17;
    const xx = W - ((t * 1600 + i * 137) % (W + 300));
    ctx.beginPath(); ctx.moveTo(xx, yy - (xx / W) * 50); ctx.lineTo(xx + 90 + (i % 3) * 40, yy - ((xx + 110) / W) * 50); ctx.stroke();
  }
  ctx.restore();

  // 3) 누굴 (오른쪽에서 통! 하고 들어와 둥실, 마지막에 휙)
  const nk = clamp01((t - 0.1) / 0.45);
  const nx = W + 220 - (W + 220 - 690) * easeOutBack(nk) - outK * 1300;
  const ny = 395 + Math.sin(t * 6) * 6;
  if (NUGUL_IMG.complete && NUGUL_IMG.naturalWidth) {
    const h = 300, w = h * NUGUL_IMG.width / NUGUL_IMG.height;
    ctx.save();
    ctx.translate(nx, ny);
    ctx.rotate(-0.08 + Math.sin(t * 3) * 0.03);
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 20;
    ctx.drawImage(NUGUL_IMG, -w * NUGUL_ANCHOR_X, -h, w, h);
    ctx.restore();
  }

  // 4) 글자 (왼쪽에서 들어옴)
  const tk = clamp01((t - 0.25) / 0.4);
  const tx = -350 + (350 + 70) * easeOutBack(tk) - outK * 900;
  ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const txt = (s, x, y, size, fill, stroke = "#5c2a3c", lw = 10) => {
    ctx.font = `${size}px ${FONT}`;
    ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y);
    ctx.fillStyle = fill; ctx.fillText(s, x, y);
  };
  ctx.save();
  ctx.translate(tx, 0);
  ctx.rotate(-0.05);
  txt("⚠️ BOSS", 10, 205, 30, "#ffe066", "#5c2a3c", 7);
  const pop = 1 + Math.max(0, 0.15 - Math.abs(t - 0.75)) * 2;   // 이름이 한 번 '팡' 커짐
  ctx.save(); ctx.translate(0, 275); ctx.scale(pop, pop);
  txt("누굴", 0, 0, 96, "#fff", "#5c2a3c", 14);
  ctx.restore();
  txt("과자 도둑 너구리", 8, 340, 26, "#fff4d6", "#5c2a3c", 7);
  ctx.restore();

  ctx.restore();
}

// =====================================================================
//  🎬 엔딩 — ENDING_NIGHT일째 밤을 버티면 클리어! (시작 화면 '엔딩 보기'로도 감상 가능)
//   0s 아침이 밝음 → 2.5s 누굴이 백기 들고 등장 "항복이에요~" → 성 "우리 친구 할래?"
//   → 누굴 "좋아요!!" → 9s 폭죽·꽃가루 + THE END → 12.5s 크레딧 & 버튼
// =====================================================================
const ENDING_NIGHT = 10;
const ENDING_PANEL_AT = 12.5;
// 크레딧 (원하는 대로 고쳐 쓰세요)
const CREDITS = [
  ["🎮", "타자 치기 게임"],
  ["💡 기획 · 아이디어", "박민진"],
  ["🦝 보스 누굴", "준던이가 만든 캐릭터"],
  ["🤖 개발 도우미", "Claude"]
];

function startEnding(fromClear) {
  if (fromClear) {
    clearSave();                                   // 클리어하면 이어하기 데이터 정리 (무한 모드 선택 시 다시 저장)
    const st = getStats();
    saveRecord({ night: state.wave, kills: state.kills, cpm: st.cpm, acc: st.acc, cleared: true });
    state.ending = { t: 0, fromClear: true, stats: st, wave: state.wave, kills: state.kills };
  } else {
    state.ending = { t: 0, fromClear: false };
  }
  state.phase = "ending";
  state.monsters = []; state.boss = null; state.bossPending = 0; state.shots = []; state.cutin = null;
  state.skill = { active: false, t: 0 };
  state.banner = null; state.bubbleTimer = 0;
  overlay.classList.add("hidden");
  input.disabled = true; input.value = "";
  sfx("victory");
}

function skipEnding() {
  // 크레딧이 뜨기 직전으로 점프 (다음 프레임에 크레딧 표시)
  if (state.phase === "ending" && state.ending.t < ENDING_PANEL_AT) state.ending.t = ENDING_PANEL_AT - 0.001;
}

function updateEnding(dt) {
  const e = state.ending;
  const before = e.t;
  e.t += dt;
  // 폭죽 터질 때마다 '펑'
  for (let i = 0; i < 16; i++) {
    const at = 9 + i * 0.45;
    if (before < at && e.t >= at) sfx("pop", 8 + (i % 6) * 2);
  }
  if (before < ENDING_PANEL_AT && e.t >= ENDING_PANEL_AT) showOverlay("ending");
}

// 말풍선 도우미
function drawBubble(x, y, text, tailLeft, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.font = `26px ${FONT}`;
  const tw = ctx.measureText(text).width, bw = tw + 40, bh = 52;
  const bx = x - bw / 2, by = y - bh;
  ctx.fillStyle = "#fff"; ctx.strokeStyle = COLOR.outline; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 26); ctx.fill(); ctx.stroke();
  const tx = tailLeft ? bx + 30 : bx + bw - 30, dir = tailLeft ? -1 : 1;
  ctx.beginPath(); ctx.moveTo(tx - 12, by + bh - 3); ctx.lineTo(tx + dir * 14, by + bh + 22); ctx.lineTo(tx + 12, by + bh - 3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 12, by + bh); ctx.lineTo(tx + dir * 14, by + bh + 22); ctx.lineTo(tx + 12, by + bh); ctx.stroke();
  ctx.fillStyle = COLOR.roofDark; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, x, by + bh / 2 + 1);
  ctx.restore();
}

function drawEnding() {
  if (state.phase !== "ending") return;
  const t = state.ending.t;
  const fade = (a, b, c, d) => Math.min(clamp01((t - a) / (b - a)), 1 - clamp01((t - c) / (d - c)));

  // 아침 햇살 (분홍빛 금색으로 물듦)
  const sun = clamp01(t / 2.5);
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, `rgba(255, 200, 120, ${0.35 * sun})`);
  g.addColorStop(1, `rgba(255, 170, 200, ${0.15 * sun})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND_Y);

  // 오프닝 문구
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const op = fade(0.3, 1.0, 2.8, 3.5);
  if (op > 0) {
    ctx.globalAlpha = op;
    ctx.font = `50px ${FONT}`; ctx.lineWidth = 11; ctx.strokeStyle = COLOR.roofDark;
    const head = state.ending.fromClear ? "마지막 밤을 버텨냈다!" : "그리고 마침내…";
    ctx.strokeText(head, W / 2, 170); ctx.fillStyle = "#fff"; ctx.fillText(head, W / 2, 170);
    ctx.font = `26px ${FONT}`; ctx.lineWidth = 7;
    const sub = state.ending.fromClear ? `${state.ending.wave}일째 아침이 밝았어요 ☀️` : `${ENDING_NIGHT}일째 아침이 밝았어요 ☀️`;
    ctx.strokeText(sub, W / 2, 222); ctx.fillText(sub, W / 2, 222);
  }
  ctx.restore();

  // 누굴: 백기를 들고 뒤뚱뒤뚱 등장 → 친구가 되어 깡총깡총
  if (t > 2.3 && NUGUL_IMG.complete && NUGUL_IMG.naturalWidth) {
    const k = clamp01((t - 2.5) / 2.5);
    const nx = W + 160 - (W + 160 - 600) * (1 - Math.pow(1 - k, 3));
    const happy = t > 7.6;
    const hop = happy ? Math.abs(Math.sin(t * 7)) * 28 : Math.abs(Math.sin(t * 5)) * 6 * (k < 1 ? 1 : 0.3);
    const ny = PATH_Y + 32;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath(); ctx.ellipse(nx, ny, 78 - hop * 0.6, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.translate(nx, ny - hop);
    ctx.rotate(Math.sin(t * 5) * 0.05);
    const h = NUGUL_H, w = h * NUGUL_IMG.width / NUGUL_IMG.height;
    // 백기 (친구가 되기 전까지)
    if (!happy) {
      ctx.strokeStyle = "#8b5e3c"; ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-70, -70); ctx.lineTo(-92, -205); ctx.stroke();
      const wv = Math.sin(t * 6) * 5;
      ctx.fillStyle = "#fff"; ctx.strokeStyle = COLOR.outline; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-92, -205);
      ctx.quadraticCurveTo(-120, -202 + wv, -150, -192 + wv);
      ctx.lineTo(-145, -160 + wv);
      ctx.quadraticCurveTo(-118, -170 + wv, -88, -172);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.drawImage(NUGUL_IMG, -w * NUGUL_ANCHOR_X, -h, w, h);
    ctx.restore();
  }

  // 대화
  drawBubble(600, PATH_Y - 190, "항복이구리ㅜㅜ 🏳️", false, fade(4.6, 4.9, 6.3, 6.6));
  drawBubble(265, GROUND_Y - 175, "과자 같이 나눠 먹을래? 🍪💕", true, fade(6.2, 6.5, 7.9, 8.2));
  drawBubble(600, PATH_Y - 205, "좋구리~~ 🥰", false, fade(7.7, 8.0, 9.6, 9.9));

  // 하트가 성과 누굴 사이에서 몽글몽글
  if (t > 6.4) {
    for (let i = 0; i < 12; i++) {
      const life = ((t - 6.4) * 0.6 + i / 12) % 1;
      const hx = 230 + ((i * 97) % 300) + Math.sin(t * 2 + i) * 15;
      const hy = GROUND_Y + 20 - life * 260;
      ctx.globalAlpha = Math.min(1, (1 - life) * 2) * clamp01((t - 6.4) * 2);
      if (i % 3 === 0) drawCookie(hx, hy, 10);           // 하트 사이로 과자도 둥실
      else drawHeart(hx, hy, 8 + (i % 3) * 3, ["#ff7aa8", "#ff4f8b", "#ffb3cf"][i % 3]);
    }
    ctx.globalAlpha = 1;
  }

  // 폭죽
  const COLORS = ["#ff5c8a", "#ffd23a", "#7fd6c2", "#c9a7ff", "#4fb3ff", "#ffa94d"];
  for (let i = 0; i < 40; i++) {
    const at = 9 + i * 0.45;
    const age = t - at;
    if (age < 0 || age > 1.3) continue;
    const fx = 90 + (i * 197) % 780, fy = 70 + (i * 71) % 160, col = COLORS[i % 6];
    const r = 10 + (1 - Math.pow(1 - Math.min(1, age / 0.9), 3)) * 70;
    ctx.globalAlpha = 1 - age / 1.3;
    for (let j = 0; j < 14; j++) {
      const a = j * Math.PI * 2 / 14;
      ctx.fillStyle = j % 2 ? col : "#fff";
      ctx.beginPath(); ctx.arc(fx + Math.cos(a) * r, fy + Math.sin(a) * r + age * age * 30, 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // 꽃가루
  if (t > 9) {
    for (let i = 0; i < 70; i++) {
      const fall = ((t - 9) * (40 + (i % 5) * 12) + i * 37) % (H + 40);
      const cx = (i * 53 + Math.sin(t * 2 + i) * 20) % W;
      ctx.save();
      ctx.translate(cx, fall - 20);
      ctx.rotate(t * 3 + i);
      ctx.fillStyle = COLORS[i % 6];
      ctx.fillRect(-5, -3, 10, 6);
      ctx.restore();
    }
  }

  // THE END
  if (t > 9.4) {
    const k = clamp01((t - 9.4) / 0.5);
    const pop = 0.6 + easeOutBack(k) * 0.4;
    ctx.save();
    ctx.translate(W / 2, 74);
    ctx.scale(pop, pop);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.globalAlpha = k;
    ctx.font = `64px ${FONT}`; ctx.lineWidth = 13; ctx.strokeStyle = COLOR.roofDark;
    ctx.strokeText("🎉 THE END 🎉", 0, 0); ctx.fillStyle = "#fff"; ctx.fillText("🎉 THE END 🎉", 0, 0);
    ctx.font = `24px ${FONT}`; ctx.lineWidth = 7;
    ctx.strokeText("성과 누굴은 과자를 나눠 먹는 친구가 되었답니다", 0, 48);
    ctx.fillText("성과 누굴은 과자를 나눠 먹는 친구가 되었답니다", 0, 48);
    ctx.restore();
  }

  // 건너뛰기 안내
  if (t < ENDING_PANEL_AT) {
    ctx.font = `15px ${FONT}`; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText("클릭 또는 Enter: 건너뛰기 ▶▶", W - 20, H - 24);
  }
}

// =====================================================================
//  📖 프롤로그 — "과자를 지켜라!"
//   과자가 가득한 성 → 군침 흘리는 누굴 → 밤이 되자 몬스터를 이끌고 공성 시작!
//   새 게임을 시작할 때마다 재생 (이어하기는 바로 시작, 시작 화면 '📖 이야기'로 따로 보기)
// =====================================================================
const PROLOGUE_END = 13;
const PROLOGUE_KEY = "nugulPrologueSeen";

function prologueSeen() { try { return localStorage.getItem(PROLOGUE_KEY) === "1"; } catch (e) { return true; } }

// 새 게임 시작: 매번 프롤로그(이야기)를 먼저 보여주고 1일째 밤으로 (클릭·Enter로 건너뛰기)
function beginNewGame(diffKey) {
  const hint = document.getElementById("soundHint"); if (hint) hint.remove();   // 게임 화면 가리지 않게
  resetRun(diffKey);
  startPrologue(true);
}

function startPrologue(thenStart) {
  state.prologue = { t: 0, thenStart };
  state.phase = "prologue";
  state.monsters = []; state.boss = null; state.banner = null; state.bubbleTimer = 0;
  overlay.classList.add("hidden");
  input.disabled = true; input.value = "";
}

function finishPrologue() {
  try { localStorage.setItem(PROLOGUE_KEY, "1"); } catch (e) {}
  const p = state.prologue;
  state.prologue = null;
  if (p && p.thenStart) startWave();
  else { state.phase = "title"; showOverlay("title"); }
}

function updatePrologue(dt) {
  state.prologue.t += dt;
  if (state.prologue.t >= PROLOGUE_END) finishPrologue();
}

// 초코칩 쿠키
function drawCookie(x, y, r) {
  ctx.fillStyle = "#e0a96d"; ctx.strokeStyle = "#8b5e3c"; ctx.lineWidth = Math.max(2, r * 0.14);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#5c3a26";
  [[-0.4, -0.3], [0.35, -0.35], [0.05, 0.1], [-0.35, 0.35], [0.4, 0.3]].forEach(([dx, dy]) => {
    ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, r * 0.13, 0, Math.PI * 2); ctx.fill();
  });
}

// 성 옆 과자 더미 — 성 체력이 줄면 과자도 줄어듦
function drawCookiePile() {
  let n = 6;
  if (["playing", "paused", "shop", "over"].includes(state.phase) && state.maxHp) n = Math.ceil(state.hp / state.maxHp * 6);
  const bx = CASTLE_X + CASTLE_W + 6, by = GROUND_Y + 50, r = 11;
  const spots = [[0, 0], [22, 0], [44, 0], [11, -18], [33, -18], [22, -36]];   // 아래부터 3-2-1 피라미드
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.beginPath(); ctx.ellipse(bx + 22, by + 12, 38, 6, 0, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < n; i++) drawCookie(bx + spots[i][0], by + spots[i][1], r);
}

function drawCaption(text, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.font = `26px ${FONT}`;
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.strokeStyle = COLOR.outline; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2 - 30, 26, tw + 60, 52, 26); ctx.fill(); ctx.stroke();
  ctx.fillStyle = COLOR.outline; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, W / 2, 53);
  ctx.restore();
}

function drawPrologue() {
  if (state.phase !== "prologue") return;
  const t = state.prologue.t;
  const fade = (a, b, c, d) => Math.min(clamp01((t - a) / (b - a)), 1 - clamp01((t - c) / (d - c)));

  // 장면 3: 밤이 찾아옴
  const dark = clamp01((t - 7.3) / 1.2);
  if (dark > 0) { ctx.fillStyle = `rgba(27, 29, 74, ${0.5 * dark})`; ctx.fillRect(0, 0, W, H); }

  // 장면 1: 성 위로 반짝이는 과자들
  const c1 = fade(0.2, 0.8, 3.4, 4.0);
  if (c1 > 0) {
    ctx.save(); ctx.globalAlpha = c1;
    for (let i = 0; i < 5; i++) {
      const a = t * 1.2 + i * 1.26;
      const cx = CASTLE_X + CASTLE_W / 2 + Math.cos(a) * 110, cy = GROUND_Y - 150 + Math.sin(a) * 60;
      drawCookie(cx, cy, 16);
      if (Math.sin(t * 4 + i) > 0.6) drawStar(cx + 14, cy - 14, 5, "#fff");
    }
    ctx.restore();
  }

  // 장면 3: 누굴 뒤에 모여드는 몬스터들
  if (t > 7.6) {
    const k = clamp01((t - 7.6) / 1.2);
    const pos = [[900, 0, "fast"], [960, 1, "tank"], [870, 2, "normal"], [1000, 0, "normal"]];
    pos.forEach(([x, lane, type], i) => {
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(x - k * 60, PATH_Y + 16 + lane * 15);
      const m = { t: t + i, idx: 0 };
      if (type === "normal") drawSlime(m); else if (type === "fast") drawWraith(m); else drawGolem(m);
      ctx.restore();
    });
  }

  // 누굴: 오른쪽에서 슬금슬금 등장 → 군침 → 손짓
  if (t > 3.4 && NUGUL_IMG.complete && NUGUL_IMG.naturalWidth) {
    const k = clamp01((t - 3.5) / 1.0);
    const nx = W + 160 - (W + 160 - 720) * (1 - Math.pow(1 - k, 3));
    const ny = PATH_Y + 32;
    const excited = t > 8.5;
    const hop = excited ? Math.abs(Math.sin(t * 6)) * 14 : Math.abs(Math.sin(t * 3)) * 4;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath(); ctx.ellipse(nx, ny, 78, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.translate(nx, ny - hop);
    ctx.rotate(Math.sin(t * 2) * 0.05);
    const h = NUGUL_H, w = h * NUGUL_IMG.width / NUGUL_IMG.height;
    ctx.drawImage(NUGUL_IMG, -w * NUGUL_ANCHOR_X, -h, w, h);
    // 군침 한 방울
    if (t > 4.6 && t < 7.6) {
      const drop = ((t - 4.6) * 0.8) % 1;
      ctx.fillStyle = "#8fd3ff"; ctx.strokeStyle = "#2b1d16"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(6, -80 + drop * 26, 4.5, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();   // 입가에서 뚝
    }
    ctx.restore();
    // 생각 풍선 속 과자
    const th = fade(4.4, 4.8, 7.2, 7.6);
    if (th > 0) {
      ctx.save(); ctx.globalAlpha = th;
      ctx.fillStyle = "#fff"; ctx.strokeStyle = COLOR.outline; ctx.lineWidth = 3;
      [[nx - 70, ny - 205, 7], [nx - 92, ny - 228, 11]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
      ctx.beginPath(); ctx.ellipse(nx - 150, ny - 280, 62, 44, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      drawCookie(nx - 165, ny - 284, 22); drawCookie(nx - 128, ny - 274, 16);
      drawHeart(nx - 112, ny - 306, 8, "#ff5c8a");
      ctx.restore();
    }
  }

  // 자막과 대사
  drawCaption("옛날 옛적, 숲속에 과자가 가득한 성이 있었어요 🍪", fade(0.2, 0.7, 3.5, 4.0));
  drawCaption("그 과자를 몰래 지켜보던 너구리 한 마리…", fade(4.0, 4.5, 7.0, 7.5));
  drawBubble(760, PATH_Y - 200, "저 과자… 다 내 거구리!", false, fade(5.6, 5.9, 7.3, 7.6));
  drawCaption("밤이 되자, 누굴은 몬스터들을 불러 모았어요!", fade(7.6, 8.1, 10.8, 11.2));
  drawBubble(720, PATH_Y - 200, "얘들아, 과자 털러 가자구리~!", false, fade(8.6, 8.9, 10.8, 11.1));

  // 장면 4: 제목
  if (t > 11.1) {
    const k = clamp01((t - 11.1) / 0.45);
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 1.5);
    ctx.translate(W / 2, 210);
    const pop = 0.6 + easeOutBack(k) * 0.4;
    ctx.scale(pop, pop);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.font = `68px ${FONT}`; ctx.lineWidth = 13; ctx.strokeStyle = COLOR.roofDark;
    ctx.strokeText("🍪 과자를 지켜라! 🍪", 0, 0); ctx.fillStyle = "#fff"; ctx.fillText("🍪 과자를 지켜라! 🍪", 0, 0);
    ctx.font = `26px ${FONT}`; ctx.lineWidth = 7;
    ctx.strokeText("몬스터 머리 위 단어를 쳐서 성의 과자를 지켜 주세요", 0, 58);
    ctx.fillText("몬스터 머리 위 단어를 쳐서 성의 과자를 지켜 주세요", 0, 58);
    ctx.restore();
  }

  ctx.font = `15px ${FONT}`; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillText("클릭 또는 Enter: 건너뛰기 ▶▶", W - 20, H - 24);
}

// 폰트를 먼저 불러온 뒤 시작 (캔버스 글자가 기본 폰트로 그려지는 것 방지)
const boot = () => { showOverlay("title"); requestAnimationFrame(loop); };
if (document.fonts && document.fonts.load) {
  Promise.race([
    document.fonts.load(`44px Jua`),
    new Promise(r => setTimeout(r, 1500))
  ]).then(boot, boot);
} else {
  boot();
}
</script>
</body>
</html>
