<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2023564021박민진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #fbe9f1;
    font-family: "Jua", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
  }
  #wrap { position: relative; width: 960px; height: 540px; flex: none; transform-origin: center center; }

  /* ---- 입력창 (캔버스 위에 겹쳐서 아래쪽 가운데) ---- */
  #inputBox {
    position: absolute; left: 50%; bottom: 2%;
    transform: translateX(-50%);
    width: 42%;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 18px;
    background: #fff;
    border: 4px solid #7a4b5c;
    border-radius: 999px;
    box-shadow: 0 5px 0 #f57fae;
  }
  #inputBox:focus-within { box-shadow: 0 5px 0 #f57fae, 0 0 0 5px rgba(255, 158, 196, 0.5); }
  #wordInput {
    flex: 1; min-width: 0;
    border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 24px; color: #7a4b5c;
  }
  #wordInput::placeholder { color: #d9a9bd; }
  #enterBtn {
    border: none; border-radius: 999px; cursor: pointer;
    padding: 6px 14px;
    font-family: inherit; font-size: 18px;
    background: #ff9ec4; color: #fff;
  }
  #enterBtn:active { transform: translateY(2px); }
  /* 오타: 흔들흔들 + 빨간 테두리 */
  #inputBox.shake { animation: shake .32s; border-color: #ff4d6d; }
  @keyframes shake {
    0%, 100% { transform: translateX(-50%); }
    20% { transform: translateX(calc(-50% - 10px)); }
    40% { transform: translateX(calc(-50% + 9px)); }
    60% { transform: translateX(calc(-50% - 6px)); }
    80% { transform: translateX(calc(-50% + 4px)); }
  }
  /* 소리 / 일시정지 버튼 */
  #ctrl { position: absolute; left: 1.6%; bottom: 3%; display: flex; gap: 6px; }
  #ctrl button {
    width: 40px; height: 40px;
    border-radius: 50%; border: 3px solid #7a4b5c; background: #fff; cursor: pointer;
    font-size: 18px; line-height: 1;
  }
  .main.ghost { background: #fff; color: #7a4b5c; border: 3px solid #ffb3cf; box-shadow: 0 4px 0 #ffb3cf; margin-left: 8px; }
  #panel .record { font-size: 18px; margin-bottom: 12px; color: #c98a00; }
  #panel .newrec { color: #ff4f8b; font-size: 22px; }
  .choice .best { font-size: 13px; color: #e0a000; }
  .choice .best.none { color: #c9a9b6; }
  .mini {
    margin-top: 6px; padding: 4px 14px; font-family: inherit; font-size: 14px;
    color: #b0798f; background: none; border: 2px dashed #e6b8c9; border-radius: 999px; cursor: pointer;
  }
  .mini:hover:not(:disabled) { color: #ff4d6d; border-color: #ff8fa6; }
  .mini:disabled { opacity: .4; cursor: not-allowed; }
  .main.danger { background: #ff5c7a; box-shadow: 0 4px 0 #d63d5c; }
  #panel .deco { font-size: 18px; margin: -4px 0 8px; }
  #panel .deco span { filter: grayscale(1); opacity: .3; margin: 0 1px; }
  #panel .deco span.on { filter: none; opacity: 1; }
  #panel .deco b { color: #ff4f8b; font-weight: normal; margin-left: 6px; }
  #panel .deco small { color: #b0798f; margin-left: 6px; font-size: .8em; }
  .main.cont { display: block; margin: 0 auto 2px; padding: 8px 26px; background: #7bd88f; box-shadow: 0 4px 0 #4fae63; }
  .main.cont small { display: block; font-size: .62em; opacity: .95; }
  #panel p.warn { font-size: 22px; color: #ff4d6d; margin: 4px 0 10px; }
  #panel p.newgame { font-size: 13px; color: #b0798f; margin: 4px 0 4px; }
  #panel.has-save .howto { display: none; }        /* 이어하기가 있으면 설명은 숨겨서 패널을 짧게 */
  #panel.has-save h2 { font-size: 24px; }
  #panel .toast { color: #4f9a3a; font-size: 16px; margin-top: 4px; }

  /* ---- 오버레이 (타이틀 / 상점 / 게임오버) ---- */
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 214, 232, 0.45);
    backdrop-filter: blur(2px);
    border-radius: 24px;
  }
  #overlay.ending { background: transparent; backdrop-filter: none; align-items: flex-end; padding-bottom: 2.5%; }
  #overlay.ending #panel { width: min(70%, 560px); padding: 18px; background: rgba(255,255,255,0.94); }
  .credits { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; margin: 6px auto 2px; max-width: 520px; font-size: 14px; }
  body.in-ending #inputBox { visibility: hidden; }
  .credits div { white-space: nowrap; background: #fff4f8; border: 1px dashed #f3cadb; border-radius: 999px; padding: 2px 10px; }
  .credits div span { margin-right: 6px; }
  .credits span { color: #b0798f; } .credits b { font-weight: normal; color: #7a4b5c; }
  #panel .thanks { color: #ff4f8b; font-size: 19px; margin: 8px 0 2px; }
  #overlay.title { padding-top: 9%; background: rgba(255, 214, 232, 0.2); backdrop-filter: none; }
  #overlay.hidden { display: none; }
  #panel {
    width: min(78%, 620px);
    background: #fff;
    border: 4px solid #7a4b5c; border-radius: 28px;
    box-shadow: 0 8px 0 #f57fae;
    padding: 26px;
    text-align: center; color: #7a4b5c;
  }
  #panel h2 { font-size: 32px; font-weight: normal; margin-bottom: 8px; }
  #panel .gold { color: #e0a000; margin-left: 10px; }
  #panel .sub, #panel .stats { font-size: 18px; margin-bottom: 12px; }
  #panel .stats b { color: #f57fae; }
  .choices { display: flex; gap: 10px; margin: 10px 0; }
  .choice {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 14px 6px;
    font-family: inherit; color: #7a4b5c; cursor: pointer;
    background: #fff4f8; border: 3px solid #ffb3cf; border-radius: 18px;
    transition: transform .1s, background .1s;
  }
  .choice:hover:not(:disabled) { transform: translateY(-3px); background: #ffe3ee; }
  .choice:disabled { opacity: .4; cursor: not-allowed; }
  .choice b { font-size: 21px; font-weight: normal; }
  .choice small { font-size: 14px; color: #b0798f; word-break: keep-all; }
  .choice .price { font-size: 17px; color: #e0a000; }
  .main {
    margin-top: 8px; padding: 10px 28px;
    font-family: inherit; font-size: 22px;
    color: #fff; background: #ff7aa8; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 0 #d9568a;
  }
  .main:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9568a; }
  .main small { font-size: .7em; opacity: .85; }
  .howto { list-style: none; font-size: 15px; line-height: 1.7; color: #9a6a7e; margin-top: 6px; }
  .howto b { color: #f57fae; font-weight: normal; }
  #soundHint {
    position: absolute; left: 14px; top: 12px; z-index: 50; transform-origin: left center;
    background: #fff; color: #7a4b5c; border: 3px solid #f57fae; border-radius: 999px;
    padding: 4px 14px; font-size: 15px; white-space: nowrap; cursor: pointer;
    box-shadow: 0 3px 0 #f57fae; animation: hintPulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes hintPulse { from { transform: scale(1); } to { transform: scale(1.06); } }
  canvas {
    width: 100%; height: 100%; display: block;
  }
  #wrap { border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(214, 120, 160, 0.35); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="inputBox">
    <input id="wordInput" type="text" placeholder="단어를 입력하고 Enter!" autocomplete="off" spellcheck="false" maxlength="40">
    <button id="enterBtn" type="button">입력</button>
  </div>
  <div id="ctrl">
    <button id="muteBtn" type="button" title="효과음 켜기/끄기">🔊</button>
    <button id="bgmBtn" type="button" title="배경음 켜기/끄기">🎵</button>
    <button id="pauseBtn" type="button" title="일시정지 (ESC)">⏸</button>
  </div>
  <div id="overlay" class="hidden"><div id="panel"></div></div>
</div>

<script>
// =====================================================================
//  한글 타이핑 디펜스 — Step 2: 귀여운 파스텔 스타일로 리디자인
// =====================================================================

// ---------- 설정 ----------
const W = 960, H = 540;
const GROUND_Y = 400;          // 땅이 시작되는 높이
const CASTLE_X = 40;           // 성 왼쪽 위치
const CASTLE_W = 150;          // 성 너비
const PATH_Y = GROUND_Y + 8;   // 몬스터가 걸어올 길의 윗선
const PATH_H = 56;             // 길 두께
const FONT = "'Jua', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif";

// 파스텔 팔레트 — 색을 바꾸고 싶으면 여기만 수정
const COLOR = {
  skyTop: "#ffd6e8", skyBottom: "#d4ecff",
  hillFar: "#c8ecd0", hillNear: "#a9e2b5",
  ground: "#9edc9a", groundDark: "#83cc83",
  path: "#ffe9c7", pathDot: "#f4d3a1",
  wall: "#fff3e6", wallShade: "#ffe0c9",
  roof: "#ff9ec4", roofDark: "#f57fae",
  tower: "#ffeaf3",
  outline: "#7a4b5c",
  blush: "rgba(255, 120, 150, 0.45)"
};

// ---------- 캔버스 준비 ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---- 화면에 꽉 맞추기: 960×540 게임을 창 크기에 맞게 통째로 확대/축소 ----
let RES = 1;
let RES_MAX = 2;                 // 렉 방지: 캔버스는 최대 1920×1080까지만 (느리면 자동으로 더 낮춤)
function setRes(r) {
  r = Math.round(r * 4) / 4;     // 0.25 단위로만 바꿔서 자주 다시 만들지 않게
  if (r !== RES) { RES = r; canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
}
function fitScreen() {
  const wrap = document.getElementById("wrap");
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  wrap.style.transform = `scale(${s})`;
  setRes(Math.min(RES_MAX, Math.max(1, s * (window.devicePixelRatio || 1))));   // 선명하게
}
// 프레임이 자주 늦으면(느린 컴퓨터) 해상도를 한 단계씩 낮춤
const perf = { slow: 0, frames: 0 };
function watchPerf(dtMs) {
  if (document.hidden) return;
  perf.frames++;
  if (dtMs > 24) perf.slow++;                  // 약 40fps 아래
  if (perf.frames >= 90) {                      // 1.5초마다 판단
    if (perf.slow > 20 && RES_MAX > 1) { RES_MAX = Math.max(1, RES_MAX - 0.5); fitScreen(); }
    perf.slow = 0; perf.frames = 0;
  }
}
window.addEventListener("resize", fitScreen);
fitScreen();

// ---------- 게임 상태 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const state = {
  time: 0,
  fps: 0,
  clouds: [
    { x: 260, y: 110, s: 1.0, v: 14 },
    { x: 560, y: 70,  s: 0.75, v: 9 },
    { x: 760, y: 150, s: 0.9, v: 12 }
  ],
  // 들판의 꽃 — 시작할 때 한 번만 랜덤 생성
  flowers: Array.from({ length: 40 }, () => {
    let y;
    do { y = rand(GROUND_Y + 12, H - 12); } while (y > PATH_Y - 8 && y < PATH_Y + PATH_H + 10); // 길 위 제외
    return {
      x: rand(CASTLE_X + CASTLE_W + 20, W - 10), y,
      c: ["#ff8fb8", "#ffd65c", "#ffffff", "#c9a7ff"][Math.floor(Math.random() * 4)],
      s: rand(0.7, 1.2)
    };
  }),
  // 둥둥 떠다니는 반짝이/하트
  sparkles: Array.from({ length: 14 }, () => ({
    x: rand(0, W), y: rand(0, GROUND_Y), v: rand(8, 20),
    type: Math.random() < 0.4 ? "heart" : "star", ph: rand(0, 6)
  })),
  blinkTimer: 3,
  // 입력 관련
  lastWord: "",                // 마지막으로 입력한 단어
  bubbleTimer: 0,              // 말풍선 표시 남은 시간
};

// =====================================================================
//  한글 입력 처리
//  - 한글은 IME가 자모를 조합(ㅅ→사→삭→사과)하는 과정을 거친다.
//  - 조합 중에 Enter를 누르면 브라우저에 따라
//    ① keydown(isComposing=true) 후 조합 완료, ② Enter keydown이 한 번 더 옴
//    → 그냥 처리하면 마지막 글자가 빠지거나 두 번 입력되는 버그가 생긴다.
//  - 해결: 조합 중 Enter는 "예약"만 해두고, compositionend(조합 완료) 시점에 제출.
//          제출 후 입력창을 비우므로 두 번째 Enter는 빈 값이라 무시된다.
// =====================================================================
const input = document.getElementById("wordInput");
const enterBtn = document.getElementById("enterBtn");
let composing = false;
let pendingSubmit = false;

input.addEventListener("compositionstart", () => { composing = true; });
input.addEventListener("compositionend", () => {
  composing = false;
  if (pendingSubmit) {
    pendingSubmit = false;
    setTimeout(submitInput, 0);   // 조합된 글자가 value에 반영된 뒤 제출
  }
});

input.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (e.isComposing || composing || e.keyCode === 229) {
    pendingSubmit = true;         // 조합 중 → 조합 끝나면 제출
    return;
  }
  submitInput();
});

enterBtn.addEventListener("click", () => { submitInput(); input.focus(); });

// 게임 화면 아무 데나 클릭해도 입력창에 포커스 유지
canvas.addEventListener("pointerdown", e => { e.preventDefault(); if (state.phase === "ending") skipEnding(); else if (state.phase === "prologue") finishPrologue(); else input.focus(); });

function submitInput() {
  const word = input.value.trim();
  input.value = "";
  if (!word || state.phase !== "playing") return;   // 빈 입력·게임 중 아닐 때 무시

  state.lastWord = word;
  state.bubbleTimer = 2.5;
  state.typing = "";
  const result = onWordEntered(word);
  if (result === "miss") typoFeedback();
  else if (typingStart) {
    // 타수 = 맞게 친 단어의 키 입력 수 ÷ 그 단어를 실제로 친 시간
    //  (첫 글자를 누른 순간 ~ Enter까지. 몬스터 기다리는 시간은 빼고 계산)
    state.stats.keys += jamo(word).length;
    state.stats.typeTime += (performance.now() - typingStart) / 1000;
  }
  typingStart = null;
}
let typingStart = null;          // 지금 단어의 첫 키를 누른 시각
// =====================================================================
//  한글 자모 분해 — 입력 중 하이라이트 & 타수 계산에 사용
//   "과" → ㄱㅗㅏ,  "닭" → ㄷㅏㄹㄱ  (겹모음·겹받침도 키 입력 단위로 쪼갬)
// =====================================================================
const CHO  = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅗㅏ","ㅗㅐ","ㅗㅣ","ㅛ","ㅜ","ㅜㅓ","ㅜㅔ","ㅜㅣ","ㅠ","ㅡ","ㅡㅣ","ㅣ"];
const JONG = ["","ㄱ","ㄲ","ㄱㅅ","ㄴ","ㄴㅈ","ㄴㅎ","ㄷ","ㄹ","ㄹㄱ","ㄹㅁ","ㄹㅂ","ㄹㅅ","ㄹㅌ","ㄹㅍ","ㄹㅎ","ㅁ","ㅂ","ㅂㅅ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const SPLIT = { "ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ",
                "ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ" };
function jamo(str) {
  let out = "";
  for (const ch of str) {
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c >= 0 && c < 11172) out += CHO[Math.floor(c / 588)] + JUNG[Math.floor((c % 588) / 28)] + JONG[c % 28];
    else out += SPLIT[ch] || ch;
  }
  return out;
}
// 지금까지 친 글자(typed)가 target의 앞부분과 맞으면, target에서 몇 글자까지 맞았는지 (안 맞으면 -1)
function matchCount(target, typed) {
  if (!typed) return 0;
  const tj = jamo(noSpace(typed));
  if (!jamo(noSpace(target)).startsWith(tj)) return -1;
  let acc = 0, i = 0;
  for (const ch of target) {
    i++;
    if (ch === " ") continue;
    acc += jamo(ch).length;
    if (acc >= tj.length) return i;
  }
  return i;
}

// =====================================================================
//  🔊 효과음 — 소리 파일 없이 Web Audio로 직접 합성
// =====================================================================
let actx = null;
let muted = false;
try { muted = localStorage.getItem("nugulMute") === "1"; } catch (e) {}

function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
// 브라우저 정책상 소리는 사용자가 한 번 클릭/키 입력을 해야만 나올 수 있음
// → 첫 입력 때 바로 오디오를 깨우고, 그 전까지는 "클릭하면 음악이 나와요" 안내를 띄움
const UNLOCK_EVENTS = ["pointerdown", "keydown", "touchend", "click"];
function unlockAudio() {
  const a = audio();
  const done = () => {
    UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, unlockAudio, true));
    const h = document.getElementById("soundHint"); if (h) h.remove();
  };
  if (a && a.state === "running") done();
  else if (a) a.resume().then(() => { if (a.state === "running") done(); }).catch(() => {});
}
UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, unlockAudio, true));
// 브라우저가 처음부터 소리를 허락한 경우(자동 재생 허용)엔 바로 시작
try { audio(); if (actx && actx.state === "running") unlockAudio(); } catch (e) {}

function tone({ f0, f1 = f0, dur = 0.15, type = "sine", vol = 0.25, delay = 0, attack = 0.01, dest, at }) {
  const a = actx, t = (at ?? a.currentTime) + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(dest || a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise({ dur = 0.3, vol = 0.3, freq = 800, filter = "lowpass", delay = 0, curve = 1, dest, at }) {
  const a = actx, t = (at ?? a.currentTime) + delay;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, curve);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = filter; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(dest || a.destination);
  src.start(t);
}
const notes = (list, gap, opt) => list.forEach((f, i) => tone({ f0: f, dur: gap * 1.6, delay: i * gap, ...opt }));

const SFX = {

    // 여러 소리를 겹쳐도 찢어지지 않게 압축기로 묶어서 크게
    const comp = a.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 10;
    comp.attack.value = 0.002; comp.release.value = 0.4;
    const out = a.createGain(); out.gain.value = 1.3;
    comp.connect(out).connect(a.destination);
    const o = { dest: comp };
    // "쿠" — 땅을 찍는 충격
    noise({ dur: 0.18, vol: 1.0, freq: 2200, ...o });
    tone({ f0: 200, f1: 60, dur: 0.16, type: "square", vol: 0.45, ...o });
    tone({ f0: 240, f1: 80, dur: 0.5, type: "triangle", vol: 0.5, ...o });      // 노트북 스피커에서도 들리는 중저음

  night:   () => { tone({ f0: 220, dur: 0.5, vol: 0.18 }); tone({ f0: 196, dur: 0.8, vol: 0.18, delay: 0.3 }); },
  morning: () => notes([523, 659, 784, 1047], 0.1, { type: "triangle", vol: 0.18 }),
  victory: () => notes([523, 659, 784, 1047, 784, 1047], 0.09, { type: "square", vol: 0.1 }),
  coin:    () => { tone({ f0: 988, dur: 0.06, type: "square", vol: 0.1 }); tone({ f0: 1319, dur: 0.15, type: "square", vol: 0.1, delay: 0.06 }); },
  over:    () => notes([392, 349, 330, 262], 0.25, { type: "triangle", vol: 0.22 }),

  meteor:  () => { tone({ f0: 900, f1: 120, dur: 0.35, type: "triangle", vol: 0.2 }); noise({ dur: 0.35, vol: 0.35, freq: 700, delay: 0.15 }); }
};

//  🎵 BGM — 음악 파일 없이 코드로 직접 연주하는 8비트 스타일 배경음악
//   · 낮/타이틀/상점: 밝은 C장조   · 밤: 으스스하지만 귀여운 A단조
//   · 보스 누굴: 빠르고 긴박한 D단조
//   음표는 MIDI 번호(60 = 가운데 도), null = 쉼표. 8분음표 32칸 = 4마디가 반복됨

const SONGS = {

           38, 38, 38, 38, 38, 38, 38, 38, 33, 33, 33, 33, 33, 33, 33, 33],
    drum: "k-s-k-sh"

const BGM_VOL = 0.14;              // 배경음 전체 크기 (효과음보다 작게)
let bgmMuted = false;
try { bgmMuted = localStorage.getItem("nugulBgmMute") === "1"; } catch (e) {}
const bgm = { song: null, step: 0, next: 0, node: null };
const midi = n => 440 * Math.pow(2, (n - 69) / 12);

function bgmOut() {
  if (!bgm.node || bgm.node.context !== actx) {
    bgm.node = actx.createGain();
    bgm.node.gain.value = bgmMuted ? 0 : BGM_VOL;
    bgm.node.connect(actx.destination);
  }
  return bgm.node;
}

// 한 칸(8분음표) 연주
function playStep(song, i, at, len) {
  const out = bgmOut();
  const m = song.mel[i], b = song.bass[i], d = song.drum[i % song.drum.length];
  if (m) {
    tone({ f0: midi(m), dur: len * 0.9, type: song.wave, vol: song.vol, at, dest: out });
    tone({ f0: midi(m + 12), dur: len * 0.5, type: "sine", vol: song.vol * 0.15, at, dest: out });   // 반짝이는 윗옥타브
  }
  if (b) tone({ f0: midi(b), dur: len * (song.bpm > 130 ? 0.8 : 1.8), type: "triangle", vol: 0.7, at, dest: out });
  if (d === "k") tone({ f0: 150, f1: 40, dur: 0.14, vol: 0.9, at, dest: out });
  if (d === "s") noise({ dur: 0.12, vol: 0.5, freq: 1800, filter: "bandpass", at, dest: out });
  if (d === "h") noise({ dur: 0.04, vol: 0.25, freq: 6000, filter: "highpass", at, dest: out });
}

// 0.025초마다 조금 앞의 음표들을 미리 예약 (끊김 없는 재생)
function bgmTick() {
  if (!actx || actx.state !== "running" || !bgm.song) return;
  const song = SONGS[bgm.song], len = 60 / song.bpm / 2;
  if (bgm.next < actx.currentTime - 0.2) bgm.next = actx.currentTime + 0.05;   // 탭 전환 후 복귀
  while (bgm.next < actx.currentTime + 0.12) {
    playStep(song, bgm.step, bgm.next, len);
    bgm.next += len;
    bgm.step = (bgm.step + 1) % 32;
  }
}
setInterval(bgmTick, 25);

// 상황에 맞는 곡 고르기 (매 프레임 호출)
function updateBgm() {
  let want = "day";
  if (state.phase === "over") want = null;
  else if (state.phase === "playing" || state.phase === "paused") want = (state.boss || state.bossPending > 0) ? "boss" : "night";
  else if (state.phase === "prologue" && state.prologue && state.prologue.t > 7.3) want = "night";
  if (want !== bgm.song) {
    bgm.song = want; bgm.step = 0;
    if (actx) bgm.next = actx.currentTime + 0.1;
  }
  if (actx && bgm.node) {                          // 일시정지 중엔 작게
    const target = bgmMuted ? 0 : state.phase === "paused" ? BGM_VOL * 0.3 : BGM_VOL;
    bgm.node.gain.setTargetAtTime(target, actx.currentTime, 0.15);
  }
}

const RECORD_KEY = "nugulDefenseRecord";
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(RECORD_KEY)) || {}; } catch (e) { return {}; }
}
function saveRecord(cur) {
  const rec = loadRecords();
  const prev = rec[state.diff];
  if ((prev && prev.cleared) || state.endless) cur.cleared = true;   // 한 번 클리어했으면 👑 유지
  const better = !prev || cur.night > prev.night || (cur.night === prev.night && cur.kills > prev.kills);
  if (better) {
    rec[state.diff] = cur;
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(rec)); } catch (e) {}
  }
  return { better, prev };
}

// 기록 삭제: 난이도 하나("easy" 등) 또는 "all"
function deleteRecord(key) {
  try {
    if (key === "all") { localStorage.removeItem(RECORD_KEY); return; }
    const rec = loadRecords();
    delete rec[key];
    localStorage.setItem(RECORD_KEY, JSON.stringify(rec));
  } catch (e) {}
}

// 타수(분당 타자 수)와 정확도
function getStats() {
  const s = state.stats;
  return {
    // 실제로 타자를 친 시간 기준 분당 타수 (한컴타자처럼 자모 단위로 셈: 닭 = ㄷㅏㄹㄱ 4타)
    cpm: s.typeTime > 1 ? Math.round(s.keys / s.typeTime * 60) : 0,
    acc: s.ok + s.miss ? Math.round(s.ok / (s.ok + s.miss) * 100) : 100,
    maxCombo: s.maxCombo
  };
}

// 콤보: 연속으로 맞히면 골드 보너스 (최대 +100%)
// 콤보가 쌓일수록 공격 모션이 진화: 💗 하트 → ⭐ 별빛 → 🌈 무지개 빔 → ☄️ 황금 유성
const ATTACKS = [
  { from: 0,  icon: "💗", name: "하트 공격", life: 0.22 },
  { from: 5,  icon: "⭐", name: "별빛 공격", life: 0.32 },
  { from: 10, icon: "🌈", name: "무지개 빔", life: 0.3 },
  { from: 20, icon: "☄️", name: "황금 유성", life: 0.4 }
];
function attackTier(c) {
  let tier = 0;
  ATTACKS.forEach((a, i) => { if (c >= a.from) tier = i; });
  return tier;
}

function comboUp() {
  state.combo++;
  state.comboPop = 0.25;
  state.stats.maxCombo = Math.max(state.stats.maxCombo, state.combo);
  const up = ATTACKS.findIndex(a => a.from === state.combo);
  if (up > 0) {                                    // 공격이 한 단계 진화한 순간
    const a = ATTACKS[up];
    addFloat(CASTLE_X + CASTLE_W / 2 + 60, GROUND_Y - 230, `공격 강화! ${a.icon} ${a.name}`, "#ff4f8b");
    sfx("powerup");
  }
}
function comboBonus() { return 1 + Math.min(state.combo, 20) * 0.05; }

  state.stats.miss++;
  if (state.combo >= 5) addFloat(W / 2, H - 120, "콤보 끊김…", "#9a7a88");

}

// 성에서 몬스터로 날아가는 하트 (공격 연출)
function shootHeart(x, y) {
  if (state.skill.active) return;
  const tier = attackTier(state.combo);
  state.shots.push({ x0: CASTLE_X + CASTLE_W / 2, y0: GROUND_Y - 175, x1: x, y1: y, t: 0, tier, life: ATTACKS[tier].life });
  if (tier === 2) sfx("zap");
  if (tier === 3) sfx("meteor");
}

function saveProgress() {
  if (!(state.wave >= 1) || !["playing", "paused", "shop"].includes(state.phase)) return;
  const st = getStats();
  saveRecord({ night: state.wave, kills: state.kills, cpm: st.cpm, acc: st.acc });
}

function pauseGame() {
  if (state.phase !== "playing") return;

  saveProgress();

// 한 판 시작할 때 상태 초기화
// =====================================================================
//  ▶ 이어하기 — 아침(상점)이 될 때마다 자동 저장, 시작 화면에서 그 아침부터 이어서
//   · 밤 도중에 나가면 → 그 밤이 시작되기 전 아침으로 돌아감
//   · 게임오버 / 엔딩 클리어 / 새 게임 시작 시 저장 데이터 삭제
// =====================================================================
const SAVE_KEY = "nugulDefenseSave";
const SAVE_FIELDS = ["diff", "wave", "hp", "maxHp", "gold", "kills", "wallLevel", "skillCooldown", "prices", "stats", "endless"];

function saveGame() {
  const data = { savedAt: Date.now() };
  SAVE_FIELDS.forEach(k => { data[k] = state[k]; });
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}
function loadGame() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && DIFF[d.diff] ? d : null; } catch (e) { return null; }
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
function continueGame() {
  const d = loadGame();
  if (!d) return;
  resetRun(d.diff);                                 // 기본값으로 초기화한 뒤
  SAVE_FIELDS.forEach(k => { if (d[k] !== undefined) state[k] = d[k]; });   // 저장된 값 덮어쓰기
  saveGame();                                       // (resetRun이 지운 저장을 다시 기록)
  state.decoToast = "";
  state.phase = "shop";
  state.banner = { text: "이어하기!", sub: `${d.wave}일째 밤을 버틴 아침부터 다시 시작해요`, t: 1.6 };
  showOverlay("shop");
}

function resetRun(diffKey) {
  clearSave();                                     // 새 게임 → 이전 이어하기 데이터 삭제
  const d = DIFF[diffKey];
  Object.assign(state, {
    diff: diffKey,
    hp: d.hp, maxHp: d.hp,
    gold: 0, kills: 0, wave: 0,
    monsters: [], puffs: [], floats: [], rings: [],
    toSpawn: 0, spawnTimer: 0, clearTimer: 0, freezeTimer: 0,
    skillCooldown: 25, skillLeft: 0,
    skill: { active: false, t: 0, landed: false },
    boss: null, bossPending: 0, cutin: null, endless: false, ending: null,
    combo: 0, comboPop: 0, shots: [], typing: "",
    stats: { keys: 0, ok: 0, miss: 0, playTime: 0, typeTime: 0, maxCombo: 0 },
    wallLevel: 0, decoToast: "",
    prices: Object.fromEntries(SHOP.map(s => [s.id, s.price]))
  });
}

// =====================================================================
//  게임 흐름: 타이틀 → 밤(웨이브) → 아침(상점) → 다음 밤 … → 게임오버
// =====================================================================
function startWave() {
  state.wave++;
  const bossNight = state.wave % BOSS_EVERY === 0;
  state.toSpawn = WAVE_BASE + state.wave * WAVE_GROW;
  if (bossNight) state.toSpawn = Math.round(state.toSpawn * 0.5);   // 보스 밤엔 잡몹 절반
  state.spawnTimer = 1.5;
  state.iceTimer = rand(...ICE_EVERY);
  state.clearTimer = 0;
  state.freezeTimer = 0;
  state.boss = null;
  state.bossPending = bossNight ? 2.5 : 0;
  state.phase = "playing";
  state.combo = 0;
  state.decoToast = "";
  sfx("night");
  state.banner = bossNight
    ? { text: `${state.wave}일째 밤`, sub: "⚠️ 과자 도둑 누굴이 나타났다!", t: 2.2 }
    : { text: `${state.wave}일째 밤`, sub: `과자를 노리는 몬스터 ${state.toSpawn}마리!`, t: 2 };
  hideOverlay();
}

function waveClear() {
  const bonus = 20 + state.wave * 5;
  state.gold += bonus;
  state.banner = { text: "아침이 밝았다! ☀️", sub: `과자를 무사히 지켰다! 보너스 +${bonus}G`, t: 1.6 };
  state.clearTimer = 1.6;           // 배너 보여준 뒤 상점 열기
  sfx("morning");
}

function gameOver() {
  state.phase = "over";
  clearSave();                                     // 성이 무너지면 이어하기 불가
  sfx("over");
  const st = getStats();
  state.result = { ...st, ...saveRecord({ night: state.wave, kills: state.kills, cpm: st.cpm, acc: st.acc }) };
  state.monsters.forEach(m => m.dying || (m.dying = 0));
  showOverlay("over");
}

function buy(id) {
  const price = state.prices[id];
  if (state.gold < price) return;
  state.gold -= price;
  if (id === "repair") state.hp = Math.min(state.maxHp, state.hp + 40);
  if (id === "wall")   {
    state.maxHp += 25; state.hp = Math.min(state.maxHp, state.hp + 25);
    state.wallLevel = (state.wallLevel || 0) + 1;              // 성 꾸미기 한 단계 업!
    const d = DECO[Math.min(state.wallLevel, DECO.length) - 1];
    state.decoToast = `${d.icon} ${d.name}${state.wallLevel > DECO.length ? " 더 많이" : ""} 장착!`;
    sfx("morning");
  }
  if (id === "skill")  state.skillCooldown = Math.max(SKILL_MIN_COOLDOWN, state.skillCooldown - 4);
  const item = SHOP.find(s => s.id === id);
  state.prices[id] = Math.round(price * item.grow);
  saveGame();                                      // 산 것도 바로 저장
  sfx("coin");
  showOverlay("shop");
}

// =====================================================================
//  몬스터
// =====================================================================
function pickType() {
  const total = Object.values(MONSTER).reduce((a, m) => a + m.weight, 0);
  let r = Math.random() * total;
  for (const [type, m] of Object.entries(MONSTER)) { if ((r -= m.weight) < 0) return type; }
  return "normal";
}

// 화면에 이미 있는 단어는 피해서 고르기 (같은 단어 두 마리면 헷갈리니까)
function pickWords(type) {
  const words = WORDS[state.diff][type];                       // 난이도별 단어장
  const used = new Set(state.monsters.flatMap(m => m.words));
  const pool = words.filter(w => [].concat(w).every(x => !used.has(x)));
  const list = pool.length ? pool : words;
  return [].concat(list[Math.floor(Math.random() * list.length)]);
}

function spawnMonster(type = pickType(), lane = Math.floor(Math.random() * 3)) {
  const waveMul = 1 + (Math.max(1, state.wave) - 1) * 0.08;      // 웨이브마다 8%씩 빨라짐
  const m = {
    type,
    words: pickWords(type),
    idx: 0,                              // 지금 쳐야 하는 단어 번호
    x: W + 60,
    y: PATH_Y + 16 + lane * 15,          // 발 위치 (3줄 중 하나)
    speed: MONSTER[type].speed * DIFF[state.diff].speed * waveMul,
    t: rand(0, 10),                      // 애니메이션용 개인 시계
    hitFlash: 0,
    dying: 0
  };
  state.monsters.push(m);
  return m;
}

function addPuff(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    state.puffs.push({ x, y, vx: rand(-60, 60), vy: rand(-90, -20), r: rand(6, 14), life: 0.5, color });
  }
}
function addFloat(x, y, text, color) {
  state.floats.push({ x, y, text, color, life: 1 });
}

function killMonster(m) {
  m.dying = 0.4;
  if (isMonster(m)) state.kills++;                 // 얼음 정령은 처치 수에 안 셈
  const g = Math.round(MONSTER[m.type].gold * comboBonus());   // 콤보 보너스
  state.gold += g;
  sfx("pop", state.combo);
  addFloat(m.x, m.y - 70, `+${g}G`, "#f2a900");
  addPuff(m.x, m.y - 30, m.type === "tank" ? 16 : 9,
          { normal: "#d9c8ff", ice: "#bfe9ff" }[m.type] || "#4a3a55");
  if (m.type === "ice") {
    state.freezeTimer = FREEZE_TIME;
    addFloat(m.x, m.y - 100, "❄️ 얼음!", "#4fb3ff");
    sfx("freeze");
  }
}

// 단어가 입력되었을 때
function onWordEntered(word) {
  if (word === SKILL_WORD) { trySkill(); return "skill"; }

  // 보스 문장 (띄어쓰기 무시)
  const b = state.boss;
  if (b && !b.dying && b.leafLeft <= 0 && noSpace(word) === noSpace(b.sentences[b.idx])) {
    state.stats.ok++;
    comboUp();
    shootHeart(b.x, b.y - 120);
    bossHit(b);
    return "hit";
  }

  // 일치하는 몬스터 중 성에 가장 가까운 놈을 공격
  const target = state.monsters
    .filter(m => !m.dying && m.words[m.idx] === word)
    .sort((a, b) => a.x - b.x)[0];
  if (!target) return "miss";

  state.stats.ok++;
  comboUp();
  shootHeart(target.x, target.y - 40);
  target.idx++;
  target.hitFlash = 0.25;
  if (target.idx >= target.words.length) {
    killMonster(target);
  } else {
    target.x += 30;                              // 탱커: 맞을 때마다 뒤로 밀려남
    addPuff(target.x - 20, target.y - 60, 5, "#ff8a3d");
    sfx("tankHit");
  }
  return "hit";
}

// =====================================================================
//  필살기 "살려줘" — 성이 무서운 얼굴로 점프 → 착지 충격파로 전멸 → 복귀
//   0.0~0.4s 웅크리기(분노)  0.4~1.1s 점프  1.1s 착지(쾅!)
//   1.1~1.6s 버티기          1.6~2.2s 되돌아오기  2.2~2.5s 진정
// =====================================================================
const JUMP_DIST = 330;           // 성이 앞으로 뛰어가는 거리

function trySkill() {
  if (state.skill.active) return;
  if (state.skillLeft > 0) {
    state.lastWord = `아직 ${Math.ceil(state.skillLeft)}초…`;
    sfx("click");
    return;
  }
  state.lastWord = "살려줘!!!";
  state.skill = { active: true, t: 0, landed: false, jumped: false, back: false };
  state.skillLeft = state.skillCooldown;
  sfx("angry");
}

// 시간 t에 따른 성의 위치·찌그러짐·표정
function castlePose() {
  const s = state.skill;
  const pose = { dx: 0, dy: 0, sx: 1, sy: 1, rot: 0, scary: false };
  if (!s.active) return pose;
  const t = s.t;
  pose.scary = t < 2.2;
  if (t < 0.4) {                                   // 분노하며 웅크림
    const k = t / 0.4;
    pose.sy = 1 - 0.18 * k; pose.sx = 1 + 0.12 * k;
    pose.dx = Math.sin(t * 90) * 3 * k;
  } else if (t < 1.1) {                            // 포물선 점프
    const p = (t - 0.4) / 0.7;
    pose.dx = JUMP_DIST * p;
    pose.dy = -230 * 4 * p * (1 - p);
    pose.sy = 1.12; pose.sx = 0.9;
    pose.rot = Math.sin(p * Math.PI * 2) * 0.12;
  } else if (t < 1.6) {                            // 착지 — 철퍼덕 찌그러졌다 복원
    const q = 1 - (t - 1.1) / 0.5;
    pose.dx = JUMP_DIST;
    pose.sy = 1 - 0.3 * q * q; pose.sx = 1 + 0.22 * q * q;
  } else if (t < 2.2) {                            // 깡총 되돌아오기
    const p = (t - 1.6) / 0.6;
    pose.dx = JUMP_DIST * (1 - p);
    pose.dy = -110 * 4 * p * (1 - p);
  } else {                                         // 제자리 착지 후 진정
    const q = 1 - (t - 2.2) / 0.3;
    pose.sy = 1 - 0.1 * q; pose.sx = 1 + 0.08 * q;
  }
  return pose;
}

function updateSkill(dt) {
  if (state.skillLeft > 0) state.skillLeft -= dt;
  const s = state.skill;
  if (!s.active) return;
  s.t += dt;
  if (!s.jumped && s.t >= 0.4) { s.jumped = true; sfx("jump"); }
  if (!s.back && s.t >= 1.6) { s.back = true; sfx("hop"); }
  if (!s.landed && s.t >= 1.1) {                   // 쾅!!
    s.landed = true;
    sfx("boom");
    state.shake = 0.9;                             // 소리에 맞춰 더 크게 흔들림
    state.flash = 0.35;
    const cx = CASTLE_X + CASTLE_W / 2 + JUMP_DIST;
    state.rings.push({ x: cx, y: GROUND_Y + 60, r: 20, life: 0.7 });
    state.rings.push({ x: cx, y: GROUND_Y + 60, r: 5, life: 0.9 });
    addPuff(cx - 60, GROUND_Y + 50, 12, "#e8d3b0");
    addPuff(cx + 60, GROUND_Y + 50, 12, "#e8d3b0");
    addFloat(cx, GROUND_Y - 190, "쿠웅!!!", "#ff3b6b");
    state.monsters.filter(m => !m.dying).forEach(killMonster);   // 화면의 몬스터 전멸
    if (state.boss && !state.boss.dying && state.boss.x < W) bossHit(state.boss, BOSS.skillKnockback);   // 보스는 1대 + 크게 밀려남
  }
  if (s.t >= 2.5) s.active = false;
}

           "될성부른 나무는 떡잎부터 알아본다", "하룻강아지 범 무서운 줄 모른다",
           "콩 심은 데 콩 나고 팥 심은 데 팥 난다", "사공이 많으면 배가 산으로 간다",
           "낮말은 새가 듣고 밤말은 쥐가 듣는다", "윗물이 맑아야 아랫물이 맑다"]
};
const noSpace = s => s.replace(/\s+/g, "");      // 띄어쓰기는 틀려도 인정

function spawnBoss() {
  const n = BOSS.hp[state.diff];
  const list = [...PROVERBS[state.diff]].sort(() => Math.random() - 0.5).slice(0, n);
  state.boss = {
    x: W + 100, y: PATH_Y + 32,
    sentences: list, idx: 0,
    // 슬라임과 똑같이 난이도·며칠째 밤 배율을 받은 뒤 20% 더 빠르게
    speed: MONSTER.normal.speed * BOSS.speedVsSlime * DIFF[state.diff].speed * (1 + (state.wave - 1) * 0.08),
    t: 0, hitFlash: 0, dying: 0,
    summonTimer: BOSS.summonEvery * 0.6,
    leafTimer: BOSS.leafEvery, leafLeft: 0,
    armUp: 0
  };
  state.shake = 0.4;
  addFloat(W - 160, GROUND_Y - 220, "🦝 과자 내놔구리!", "#a0704c");
  sfx("bossIn");
  startCutin();                                    // 등장 컷인
}

function bossHit(b, kb = BOSS.knockback) {
  b.idx++;
  b.hitFlash = 0.35;
  b.leafLeft = 0;                                // 맞으면 둔갑술 풀림
  // 뒤로 밀려남: 순간이동이 아니라 0.3초 동안 데굴데굴 밀려가도록 거리만 예약
  b.kbLeft = (b.kbLeft || 0) + kb;
  b.kbTotal = b.kbLeft;
  addFloat(b.x + 150, b.y - 120, "아야구리!", "#a0704c");
  state.shake = Math.max(state.shake, 0.3);
  addPuff(b.x - 40, b.y - 110, 8, "#e8c9a8");
  if (b.idx >= b.sentences.length) {             // 격파!
    b.dying = 1.4;
    state.kills++;
    const g = BOSS.gold + state.wave * 10;
    state.gold += g;
    state.banner = { text: "보스 누굴 격파! 🎉", sub: `과자를 지켜냈다! +${g}G`, t: 2 };
    sfx("victory");
    for (let i = 0; i < 4; i++) addPuff(b.x + rand(-60, 60), b.y - rand(40, 150), 6, ["#7cc35a", "#ff9ec4", "#ffd65c", "#c9a27e"][i]);
    addFloat(b.x, b.y - 210, `+${g}G`, "#f2a900");
  } else {
    addFloat(b.x, b.y - 272, `${b.idx}/${b.sentences.length}`, "#ff5c8a");
    sfx("bossHit");
  }
}

function updateBoss(dt, speedMul) {
  if (state.bossPending > 0) {                  // 밤 시작 후 잠깐 뒤 등장
    state.bossPending -= dt;
    if (state.bossPending <= 0) spawnBoss();
  }
  const b = state.boss;
  if (!b) return;
  b.t += dt;
  if (b.hitFlash > 0) b.hitFlash -= dt;
  if (b.armUp > 0) b.armUp -= dt;
  if (b.dying) { b.dying -= dt; if (b.dying <= 0) state.boss = null; return; }

  // 넉백: 남은 거리만큼 빠르게 뒤로 밀려남 (필살기 중에도 진행)
  if (b.kbLeft > 0) {
    const step = Math.min(b.kbLeft, 700 * dt);
    b.x = Math.min(W - 70, b.x + step);           // 화면 밖으로는 안 나가게
    b.kbLeft -= step;
    if (Math.random() < 0.5) addPuff(b.x - 50, b.y - 6, 1, "#e8d3b0");   // 발밑 흙먼지
    if (b.x >= W - 70) b.kbLeft = 0;
    return;                                        // 밀려나는 동안은 걷지 않음
  }
  if (!speedMul) return;                         // 필살기 중엔 멈춤

  b.x -= b.speed * speedMul * dt;

  // 패턴 ① 부하 소환
  b.summonTimer -= dt;
  if (b.summonTimer <= 0 && b.x < W - 40) {
    b.summonTimer = BOSS.summonEvery;
    b.armUp = 0.8;
    const ORDER = { fast: 0, normal: 1, tank: 2 };       // 빠른 놈이 앞, 느린 골렘이 맨 뒤
    const list = (state.wave >= BOSS.summonVariedFrom
      ? [...BOSS.summonVaried[state.diff]]
      : ["normal", "normal"]).sort((p, q) => ORDER[p] - ORDER[q]);
    // 누굴 바로 앞에서부터 뒤쪽으로 줄지어 등장 (라벨이 안 겹치게 간격 + 3줄 번갈아)
    list.forEach((type, i) => {
      const m = spawnMonster(type, i % 3);
      m.x = b.x - 40 + i * (type === "tank" ? 120 : 80);
      if (i > 0) m.x = Math.max(m.x, state.monsters[state.monsters.length - 2].x + (type === "tank" ? 140 : 80));
      addPuff(Math.min(m.x, W - 20), m.y - 20, 5, "#e8c9a8");
    });
    addFloat(b.x, b.y - 250, list.length > 2 ? `과자 털어라구리~! ×${list.length}` : "과자 털어라구리~!", "#a0704c");
    sfx("summon");
  }
  // 패턴 ② 둔갑술 (문장 숨기기)
  if (b.leafLeft > 0) b.leafLeft -= dt;
  b.leafTimer -= dt;
  if (b.leafTimer <= 0 && b.x < W - 40) {
    b.leafTimer = BOSS.leafEvery;
    b.leafLeft = BOSS.leafTime;
    addPuff(b.x, b.y - 150, 10, "#9fd38a");
    addFloat(b.x, b.y - 250, "둔갑술! 🍃", "#4f9a3a");
    sfx("leaf");
  }
  // 성에 도착 → 큰 피해 + 튕겨남
  if (b.x < CASTLE_X + CASTLE_W + 70) {
    state.hp = Math.max(0, state.hp - BOSS.damage);
    state.hurtTimer = 0.8;
    state.shake = 0.6;
    addFloat(CASTLE_X + CASTLE_W / 2, GROUND_Y - 150, `-${BOSS.damage}`, "#ff4d6d");
    sfx("hurt");
    addPuff(b.x - 50, b.y - 60, 14, "#c9a27e");
    b.x += 300;
  }
}

function updateMonsters(dt) {
  // 웨이브 클리어 후 상점 열기 대기
  if (state.clearTimer > 0) {
    state.clearTimer -= dt;
    if (state.clearTimer <= 0) {
      if (state.wave >= ENDING_NIGHT && !state.endless) startEnding(true);   // 마지막 밤까지 버팀 → 엔딩!
      else { state.phase = "shop"; saveGame(); showOverlay("shop"); }   // 아침마다 자동 저장
    }
    return;
  }

  // 등장
  state.spawnTimer -= dt;
  if (state.toSpawn > 0 && state.spawnTimer <= 0 && !state.skill.active) {
    spawnMonster();
    state.toSpawn--;
    state.spawnTimer = rand(1.4, 2.4) * Math.max(0.55, 1 - state.wave * 0.05);
  }
  // 얼음 정령: 몬스터 수와 상관없이 밤 동안 가끔 찾아오는 손님
  state.iceTimer = (state.iceTimer ?? rand(...ICE_EVERY)) - dt;
  if (state.iceTimer <= 0 && state.toSpawn > 0 && !state.skill.active) {
    spawnMonster("ice");
    state.iceTimer = rand(...ICE_EVERY);
  }

  if (state.freezeTimer > 0) state.freezeTimer -= dt;
  const speedMul = state.skill.active ? 0 : state.freezeTimer > 0 ? 0.3 : 1;
  updateBoss(dt, speedMul);

  for (const m of state.monsters) {
    m.t += dt * (speedMul || 0.2);
    if (m.hitFlash > 0) m.hitFlash -= dt;
    if (m.dying) { m.dying -= dt; if (m.dying <= 0) m.dead = true; continue; }
    m.x -= m.speed * speedMul * dt;
    // 얼음 정령은 착한 몬스터라 성을 공격하지 않음 → 놓치면 하늘로 휙 날아가 버림
    if (m.type === "ice" && m.x < CASTLE_X + CASTLE_W + 25) {
      m.escaping = 0.7;
      m.dying = 0.7;
      addPuff(m.x, m.y - 40, 6, "#bfe9ff");
      addFloat(m.x + 30, m.y - 110, "휙~ 놓쳤다…", "#4fb3ff");
      sfx("leaf");
      continue;
    }
    // 성에 도착 → 쿵! 체력 감소
    if (m.x < CASTLE_X + CASTLE_W + 25) {
      const dmg = MONSTER[m.type].damage;
      state.hp = Math.max(0, state.hp - dmg);
      state.hurtTimer = 0.6;
      state.shake = Math.max(state.shake, 0.2);
      m.dead = true;
      addPuff(m.x, m.y - 30, 10, "#7a6a80");
      addFloat(CASTLE_X + CASTLE_W / 2, GROUND_Y - 150, `-${dmg}`, "#ff4d6d");
      sfx("hurt");
    }
  }
  state.monsters = state.monsters.filter(m => !m.dead);

  if (state.hp <= 0) { gameOver(); return; }
  // 클리어 조건: 진짜 몬스터만 다 처치하면 됨 (얼음 정령은 기다리지 않음)
  if (state.toSpawn === 0 && !state.monsters.some(m => isMonster(m) && !m.dead) && !state.boss && !(state.bossPending > 0) && !state.skill.active) {
    state.monsters.filter(m => !m.dying).forEach(m => { m.escaping = 0.7; m.dying = 0.7; });   // 남은 얼음 정령은 휙 날아감
    waveClear();
  }
}

// 이펙트(연기, 떠오르는 글자, 충격파, 흔들림) — 상점/게임오버 중에도 계속 움직임
function updateEffects(dt) {
  // 밤(몬스터 습격 중)에는 어두워지고, 클리어하면 아침으로
  const nightTarget = (state.phase === "playing" || state.phase === "paused") && !(state.clearTimer > 0) ? 1 : 0;
  if (state.comboPop > 0) state.comboPop -= dt;
  for (const h of state.shots) h.t += dt;
  state.shots = state.shots.filter(h => h.t < h.life);
  state.night += (nightTarget - state.night) * Math.min(1, dt * 1.5);
  for (const p of state.puffs) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += 20 * dt; }
  state.puffs = state.puffs.filter(p => p.life > 0);
  for (const f of state.floats) { f.life -= dt; f.y -= 40 * dt; }
  state.floats = state.floats.filter(f => f.life > 0);
  for (const r of state.rings) { r.life -= dt; r.r += 700 * dt; }
  state.rings = state.rings.filter(r => r.life > 0);
  if (state.hurtTimer > 0) state.hurtTimer -= dt;
  if (state.shake > 0) state.shake -= dt;
  if (state.flash > 0) state.flash -= dt;
  if (state.banner && (state.banner.t -= dt) <= 0) state.banner = null;
}

//  오버레이 화면 (타이틀 / 상점 / 게임오버) — HTML로 만들어 클릭·키보드 모두 지원
// =====================================================================
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");

function hideOverlay() {
  overlay.classList.add("hidden");
  input.disabled = false;
  input.focus();
}

function showOverlay(kind) {
  overlay.classList.remove("hidden");
  input.disabled = true;
  input.value = "";
  state.typing = "";
  overlay.dataset.kind = kind;
  overlay.classList.toggle("title", kind === "title");
  overlay.classList.toggle("ending", kind === "ending");
  if (kind !== "title") panel.classList.remove("has-save");

  if (kind === "title") {
    const rec = loadRecords();
    const sv = loadGame();
    panel.classList.toggle("has-save", !!sv);
    panel.innerHTML = `
      ${sv ? `<button class="main cont" data-act="continue">▶ 이어하기
          <small>${DIFF[sv.diff].label} · 🌙 ${sv.wave}일째 밤 클리어 · 🏰 ${sv.hp}/${sv.maxHp} · 💰 ${sv.gold}G · Enter</small></button>

        ${Object.entries(DIFF).map(([k, d], i) => `
          <button class="choice" data-diff="${k}"><b>${i + 1}. ${d.label}</b><small>${d.desc}</small>
            ${rec[k] ? `<span class="best">${rec[k].cleared ? "👑" : "🏆"} ${rec[k].night}일째 밤 · ${rec[k].kills}마리</span>`
                     : `<span class="best none">🏆 기록 없음</span>`}</button>`).join("")}
      </div>
      <ul class="howto">
        <li>몬스터 머리 위 단어를 치고 <b>Enter</b>! · 🏁 <b>${ENDING_NIGHT}일째 밤</b>까지 버티면 클리어</li>
        <li>🌋 골렘은 단어 여러 개를 순서대로 · ❄️ 얼음 정령을 잡으면 모두 느려져요</li>
        <li>🦝 3일째 밤마다 보스 <b>누굴</b> 등장! 속담을 끝까지 쳐야 해요</li>
        <li>😡 위험할 땐 <b>살려줘</b>를 입력하세요…</li>
      </ul>

      <button class="mini" data-act="ending">🎬 엔딩 보기</button>
      <button class="mini" data-act="reset" ${Object.keys(rec).length ? "" : "disabled"}>🗑 기록 지우기</button>`;
    state.toast = "";
  } else if (kind === "ending") {
    const e = state.ending;
    panel.innerHTML = `
      ${e.fromClear ? `
        <p class="stats">👑 <b>${DIFF[state.diff].label}</b> 클리어! · 🌙 ${e.wave}일째 밤 · 👾 처치 <b>${e.kills}</b></p>
        <p class="stats">⌨️ 타수 <b>${e.stats.cpm}</b>타/분 · 🎯 정확도 <b>${e.stats.acc}%</b> · 🔥 최대 콤보 <b>${e.stats.maxCombo}</b></p>` : ""}
      <div class="credits">${CREDITS.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join("")}</div>
      <p class="thanks">플레이해 주셔서 감사합니다! 💕</p>
      <button class="main" data-act="home">처음으로 <small>(Enter)</small></button>
      ${e.fromClear ? `<button class="main ghost" data-act="endless">계속하기 · 무한 모드 ▶</button>` : ""}`;
  } else if (kind === "confirmNew") {
    // 이어하기가 있는데 새 게임을 고르면 한 번 더 확인
    const sv = loadGame();
    panel.innerHTML = `
      <h2>⚠️ 잠깐만요!</h2>
      <p class="warn">하던 게임을 중단하고 새 게임을 하시겠습니까?</p>
      <p class="sub">지금 저장된 게임: <b>${DIFF[sv.diff].label}</b> · 🌙 ${sv.wave}일째 밤 클리어 · 🏰 ${sv.hp}/${sv.maxHp} · 💰 ${sv.gold}G<br>
        새 게임(<b>${DIFF[state.pendingDiff].label}</b>)을 시작하면 이어하기 기록은 <b>사라져요.</b></p>
      <button class="main danger" data-act="newgame">새 게임 시작</button>
      <button class="main ghost" data-act="back">취소 <small>(ESC)</small></button>`;
  } else if (kind === "reset") {
    // 기록 삭제 확인 화면 (브라우저 confirm 창은 막혀 있어서 직접 만듦)
    const rec = loadRecords();
    panel.innerHTML = `
      <h2>🗑 어떤 기록을 지울까요?</h2>
      <p class="sub">지운 기록은 되돌릴 수 없어요.</p>

      </div>
      <button class="main danger" data-del="all">전부 지우기 <small>(이어하기 포함)</small></button>
      <button class="main ghost" data-act="back">취소 <small>(ESC)</small></button>`;
  } else if (kind === "shop") {
    panel.innerHTML = `
      <h2>🛒 상점 <span class="gold">💰 ${state.gold}G</span></h2>
      <p class="sub">🏰 체력 ${state.hp} / ${state.maxHp} · 😡 필살기 쿨타임 ${state.skillCooldown}초</p>
      <p class="deco">🏰 성 꾸미기 ${DECO.map((d, i) => `<span class="${i < state.wallLevel ? "on" : ""}" title="${d.name}">${d.icon}</span>`).join("")}
        ${state.decoToast ? `<b>${state.decoToast}</b>` : `<small>성벽을 강화하면 장식이 붙어요</small>`}</p>
      <div class="choices">
        ${SHOP.map((s, i) => {
          const p = state.prices[s.id];
          const full = s.id === "repair" && state.hp >= state.maxHp;
          const maxed = s.id === "skill" && state.skillCooldown <= SKILL_MIN_COOLDOWN;   // 더 못 줄임
          let desc = s.desc;
          if (s.id === "wall") desc += ` · 다음 장식 ${DECO[Math.min(state.wallLevel || 0, DECO.length - 1)].icon}`;
          if (maxed) desc = `최소 쿨타임 ${SKILL_MIN_COOLDOWN}초 도달!`;
          return `<button class="choice" data-buy="${s.id}" ${state.gold < p || full || maxed ? "disabled" : ""}>
            <b>${i + 1}. ${s.name}</b><small>${desc}</small><span class="price">${maxed ? "MAX ✨" : p + "G"}</span></button>`;
        }).join("")}
      </div>
      <button class="main" data-act="next">🌙 ${state.wave + 1}일째 밤 맞이하기 ▶ <small>(Enter)</small></button>`;
  } else if (kind === "over") {
    const r = state.result;
    panel.innerHTML = `
      <h2>성이 무너졌어요 😭</h2>
      <p class="sub">누굴: “과자 잘 먹겠구리~ 🍪”</p>
      <p class="stats">🌙 <b>${state.wave}</b>일째 밤에 함락 · 👾 처치 <b>${state.kills}</b> · 💰 <b>${state.gold}G</b> · ${DIFF[state.diff].label}</p>
      <p class="stats">⌨️ 타수 <b>${r.cpm}</b>타/분 · 🎯 정확도 <b>${r.acc}%</b> · 🔥 최대 콤보 <b>${r.maxCombo}</b></p>
      ${r.better
        ? `<p class="record newrec">🎉 ${DIFF[state.diff].label} 신기록!</p>`
        : `<p class="record">🏆 최고 기록: ${r.prev.night}일째 밤 · ${r.prev.kills}마리</p>`}
      <button class="main" data-act="retry">다시 하기 <small>(Enter)</small></button>`;
  } else if (kind === "pause") {
    panel.innerHTML = `
      <h2>⏸ 일시정지</h2>
      <p class="record">💾 지금까지의 기록이 저장됐어요</p>
      <p class="stats">🌙 ${state.wave}일째 밤 · 🏰 ${state.hp}/${state.maxHp} · 👾 ${state.kills}마리 · 🔥 콤보 ${state.combo}</p>
      <button class="main" data-act="resume">계속하기 <small>(ESC)</small></button>
      <button class="main ghost" data-act="home">처음으로</button>`;
  }
}

panel.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.diff) {
    if (loadGame()) { state.pendingDiff = b.dataset.diff; showOverlay("confirmNew"); }   // 이어하기가 있으면 먼저 확인
    else beginNewGame(b.dataset.diff);
  }
  else if (b.dataset.act === "newgame") beginNewGame(state.pendingDiff);
  else if (b.dataset.act === "story") startPrologue(false);
  else if (b.dataset.buy) buy(b.dataset.buy);
  else if (b.dataset.act === "next") startWave();
  else if (b.dataset.act === "retry") { state.phase = "title"; state.monsters = []; showOverlay("title"); }
  else if (b.dataset.act === "resume") resumeGame();
  else if (b.dataset.act === "reset") showOverlay("reset");
  else if (b.dataset.act === "ending") { state.diff = state.diff || "normal"; startEnding(false); }
  else if (b.dataset.act === "endless") { state.endless = true; state.phase = "shop"; saveGame(); showOverlay("shop"); }
  else if (b.dataset.act === "continue") continueGame();
  else if (b.dataset.act === "back") showOverlay("title");
  else if (b.dataset.del) {
    deleteRecord(b.dataset.del);
    if (b.dataset.del === "all") clearSave();
    state.toast = b.dataset.del === "all" ? "모든 기록을 지웠어요." : `${DIFF[b.dataset.del].label} 기록을 지웠어요.`;
    showOverlay("title");
  }
  else if (b.dataset.act === "home") {
    saveProgress();                                // 중간에 그만둬도 기록 저장
    state.phase = "title"; state.monsters = []; state.boss = null; showOverlay("title");
  }
  if (!b.dataset.buy) sfx("click");
});

// 오버레이에서 숫자키 / Enter
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ["reset", "confirmNew"].includes(overlay.dataset.kind) && !overlay.classList.contains("hidden")) {
    e.preventDefault(); showOverlay("title"); return;   // 기록 삭제 화면에서 ESC = 취소
  }
  if (e.key === "Escape") {                        // ESC: 일시정지 / 계속하기
    e.preventDefault();
    if (state.phase === "playing") pauseGame();      // 일시정지 + 기록 저장
    else if (state.phase === "paused") resumeGame();
    return;
  }
  if (state.phase === "prologue" && ["Enter", " ", "Escape"].includes(e.key)) {
    e.preventDefault(); finishPrologue(); return;    // 프롤로그 건너뛰기
  }
  if (state.phase === "ending" && overlay.classList.contains("hidden") && ["Enter", " ", "Escape"].includes(e.key)) {
    e.preventDefault(); skipEnding(); return;        // 엔딩 건너뛰기
  }
  if (overlay.classList.contains("hidden")) return;
  const kind = overlay.dataset.kind;
  const n = parseInt(e.key, 10);
  if (!isNaN(n) || e.key === "Enter") e.preventDefault();   // 누른 숫자가 입력창에 들어가지 않게
  if (kind === "title" && n >= 1 && n <= 3) panel.querySelectorAll("[data-diff]")[n - 1].click();
  if (kind === "shop" && n >= 1 && n <= SHOP.length) panel.querySelectorAll("[data-buy]")[n - 1].click();
  if (e.key === "Enter") {
    if (kind === "title" && loadGame()) continueGame();       // 시작 화면에서 Enter = 이어하기
    if (kind === "shop") startWave();
    if (kind === "over") panel.querySelector("[data-act=retry]").click();
    if (kind === "pause") resumeGame();
    if (kind === "ending") panel.querySelector("[data-act=home]").click();
  }
});

// =====================================================================
//  게임 루프 (requestAnimationFrame + 델타 타임)
// =====================================================================
let lastTime = performance.now();
let fpsAcc = 0, fpsFrames = 0;

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  watchPerf(dt * 1000);
  if (dt > 0.1) dt = 0.1;

  update(dt);
  draw();

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) { state.fps = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }
  requestAnimationFrame(loop);
}

// ---------- 업데이트 ----------
function update(dt) {
  state.time += dt;
  for (const c of state.clouds) {
    c.x -= c.v * dt;
    if (c.x < -150) c.x = W + 60;
  }
  for (const s of state.sparkles) {
    s.y -= s.v * dt;
    if (s.y < -10) { s.y = GROUND_Y; s.x = rand(0, W); }
  }
  // 성이 가끔 눈을 깜빡임
  state.blinkTimer -= dt;
  if (state.blinkTimer < -0.15) state.blinkTimer = rand(2, 4);
  if (state.bubbleTimer > 0) state.bubbleTimer -= dt;
  if (state.phase === "playing") {
    state.stats.playTime += dt;
    if (state.cutin) {                             // 컷인 중엔 모든 게 잠깐 멈춤
      state.cutin.t += dt;
      if (state.cutin.t >= CUTIN_TIME) state.cutin = null;
    } else {
      updateSkill(dt);
      updateMonsters(dt);
    }
  }
  if (state.phase === "ending") updateEnding(dt);
  if (state.phase === "prologue") updatePrologue(dt);
  document.body.classList.toggle("in-ending", state.phase === "ending" || state.phase === "prologue");   // 엔딩 땐 입력창 숨김
  updateEffects(dt);
  updateBgm();
}

// ---------- 그리기 ----------
function draw() {
  ctx.setTransform(RES, 0, 0, RES, 0, 0);   // 960×540 좌표계를 화면 해상도에 맞게
  ctx.save();
  if (state.shake > 0) ctx.translate(rand(-1, 1) * state.shake * 18, rand(-1, 1) * state.shake * 12);  // 화면 흔들림
  drawSky();
  drawSun();
  drawHills();
  drawClouds();
  drawSparkles();
  drawGround();
  drawCookiePile();                                // 성이 지키는 과자 더미
  drawNight();
  drawFreeze();
  drawBoss();
  drawMonsters();
  drawBossLabel();
  drawCastle();            // 점프할 때 몬스터 위로 보이도록 몬스터 다음에 그림
  drawPuffs();
  drawRings();
  drawSpeechBubble();
  drawFloats();
  drawShots();
  ctx.restore();
  drawFlash();
  drawHUD();
  drawCombo();
  drawBanner();
  drawCutin();
  drawEnding();
  drawPrologue();
}

// --- 성이 방금 입력한 단어를 말풍선으로 외침 ---
function drawSpeechBubble() {
  if (state.bubbleTimer <= 0) return;
  const t = state.bubbleTimer;
  const pop = Math.min(1, (2.5 - t) * 8);              // 처음에 뿅! 커지기
  const fade = Math.min(1, t * 2);                      // 끝날 때 서서히 사라지기
  const text = state.lastWord + "!";
  ctx.font = `28px ${FONT}`;
  const tw = ctx.measureText(text).width;
  const bw = tw + 40, bh = 52;
  const bx = 205, by = 175;                             // 성 오른쪽 위

  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(bx, by + bh / 2);
  ctx.scale(pop, pop);
  ctx.translate(-bx, -(by + bh / 2));

  ctx.fillStyle = "#fff";
  ctx.strokeStyle = COLOR.outline;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 26); ctx.fill(); ctx.stroke();
  // 꼬리
  ctx.beginPath();
  ctx.moveTo(bx + 18, by + bh - 4);
  ctx.lineTo(bx - 8, by + bh + 22);
  ctx.lineTo(bx + 38, by + bh - 4);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx + 18, by + bh);
  ctx.lineTo(bx - 8, by + bh + 22);
  ctx.lineTo(bx + 38, by + bh);
  ctx.stroke();

  ctx.fillStyle = COLOR.roofDark;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(text, bx + 20, by + bh / 2 + 2);
  ctx.restore();
}

// --- 공통 도우미: 귀여운 얼굴 (눈 + 볼터치 + 입) ---
function drawFace(x, y, size, opts = {}) {
  const eyeGap = size * 0.55;
  const blink = opts.blink;
  ctx.fillStyle = COLOR.outline;
  ctx.strokeStyle = COLOR.outline;
  ctx.lineWidth = Math.max(2, size * 0.12);
  ctx.lineCap = "round";
  if (opts.scary) {                     // 필살기: 분노한 얼굴
    // 성난 눈썹
    ctx.lineWidth = size * 0.16;
    ctx.beginPath();
    ctx.moveTo(x - eyeGap * 0.85, y - size * 0.32); ctx.lineTo(x - eyeGap * 0.2, y - size * 0.12);
    ctx.moveTo(x + eyeGap * 0.85, y - size * 0.32); ctx.lineTo(x + eyeGap * 0.2, y - size * 0.12);
    ctx.stroke();
    // 이글거리는 빨간 눈
    ctx.save();
    ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 14;
    ctx.fillStyle = "#ff2a2a";
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + sgn * eyeGap * 0.75, y - size * 0.1);
      ctx.lineTo(x + sgn * eyeGap * 0.2, y + size * 0.02);
      ctx.lineTo(x + sgn * eyeGap * 0.7, y + size * 0.1);
      ctx.fill();
    }
    ctx.restore();
    // 쩍 벌린 입 + 톱니 이빨
    const mw = size * 0.9, my = y + size * 0.32;
    ctx.fillStyle = "#5a0a1e";
    ctx.beginPath(); ctx.roundRect(x - mw / 2, my - size * 0.12, mw, size * 0.42, size * 0.12); ctx.fill();
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 5; i++) {
      const tx = x - mw / 2 + 2 + i * (mw - 4) / 5, tw = (mw - 4) / 5;
      ctx.beginPath(); ctx.moveTo(tx, my - size * 0.12); ctx.lineTo(tx + tw / 2, my + size * 0.04); ctx.lineTo(tx + tw, my - size * 0.12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx, my + size * 0.3); ctx.lineTo(tx + tw / 2, my + size * 0.15); ctx.lineTo(tx + tw, my + size * 0.3); ctx.fill();
    }
    return;
  }
  if (opts.hurt) {                      // 아파하는 얼굴 > <
    ctx.beginPath();
    ctx.moveTo(x - eyeGap / 2 - size * 0.12, y - size * 0.12); ctx.lineTo(x - eyeGap / 2 + size * 0.1, y); ctx.lineTo(x - eyeGap / 2 - size * 0.12, y + size * 0.12);
    ctx.moveTo(x + eyeGap / 2 + size * 0.12, y - size * 0.12); ctx.lineTo(x + eyeGap / 2 - size * 0.1, y); ctx.lineTo(x + eyeGap / 2 + size * 0.12, y + size * 0.12);
    ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, y + size * 0.3, size * 0.1, size * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    return;
  }
  for (const dx of [-eyeGap / 2, eyeGap / 2]) {
    if (blink || opts.closed) {         // 감은 눈 ^ ^
      ctx.beginPath();
      ctx.arc(x + dx, y + size * 0.05, size * 0.14, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    } else {                            // 반짝이는 동그란 눈
      ctx.beginPath(); ctx.arc(x + dx, y, size * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x + dx - size * 0.04, y - size * 0.05, size * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COLOR.outline;
    }
  }
  // 볼터치
  ctx.fillStyle = COLOR.blush;
  for (const dx of [-eyeGap * 0.85, eyeGap * 0.85]) {
    ctx.beginPath(); ctx.ellipse(x + dx, y + size * 0.22, size * 0.17, size * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 입 (ω 모양)
  ctx.beginPath();
  ctx.arc(x - size * 0.08, y + size * 0.2, size * 0.08, 0, Math.PI);
  ctx.arc(x + size * 0.08, y + size * 0.2, size * 0.08, 0, Math.PI);
  ctx.stroke();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, COLOR.skyTop);
  g.addColorStop(1, COLOR.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y);
}

function drawSun() {
  if (state.night > 0.98) return;
  ctx.save();
  ctx.globalAlpha = 1 - state.night;
  ctx.translate(0, state.night * 80);        // 해가 지면서 살짝 내려감
  drawSunBody();
  ctx.restore();
}

function drawSunBody() {
  const x = 860, y = 90, r = 42;
  // 빙글빙글 도는 햇살
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(state.time * 0.3);
  ctx.fillStyle = "#ffe08a";
  for (let i = 0; i < 10; i++) {
    ctx.rotate(Math.PI / 5);
    ctx.beginPath(); ctx.roundRect(r + 6, -5, 16, 10, 5); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = "#ffd25c";
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  drawFace(x, y, 34, { closed: true });
}

function drawHills() {
  // 뒤쪽 언덕
  ctx.fillStyle = COLOR.hillFar;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, GROUND_Y - 70 - Math.sin(x * 0.008) * 30 - Math.sin(x * 0.021) * 12);
  ctx.lineTo(W, GROUND_Y); ctx.fill();
  // 앞쪽 언덕
  ctx.fillStyle = COLOR.hillNear;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, GROUND_Y - 30 - Math.sin(x * 0.012 + 2) * 18);
  ctx.lineTo(W, GROUND_Y); ctx.fill();
}

function drawClouds() {
  for (const c of state.clouds) {
    const bob = Math.sin(state.time * 1.5 + c.x * 0.01) * 4;   // 둥실둥실
    const x = c.x, y = c.y + bob, s = c.s;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(x,           y,          26 * s, 0, Math.PI * 2);
    ctx.arc(x + 30 * s,  y - 16 * s, 32 * s, 0, Math.PI * 2);
    ctx.arc(x + 64 * s,  y,          26 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath(); ctx.roundRect(x - 10 * s, y - 4 * s, 84 * s, 30 * s, 15 * s); ctx.fill();
    drawFace(x + 32 * s, y + 2 * s, 22 * s, { closed: true });
  }
}

function drawSparkles() {
  for (const s of state.sparkles) {
    const a = 0.5 + Math.sin(state.time * 3 + s.ph) * 0.4;
    const x = s.x + Math.sin(state.time + s.ph) * 10;
    ctx.globalAlpha = a;
    if (s.type === "heart") drawHeart(x, s.y, 7, "#ff9ec4");
    else drawStar(x, s.y, 5, "#ffffff");
  }
  ctx.globalAlpha = 1;
}

function drawHeart(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.4);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  ctx.fill();
}

function drawStar(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const rr = i % 2 ? r * 0.35 : r;
    const ang = i * Math.PI / 4;
    ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr);
  }
  ctx.fill();
}

function drawGround() {
  ctx.fillStyle = COLOR.ground;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  // 몽글몽글한 잔디 경계
  ctx.fillStyle = COLOR.ground;
  for (let x = 0; x < W; x += 30) {
    ctx.beginPath(); ctx.arc(x + 15, GROUND_Y + 2, 16, Math.PI, 0); ctx.fill();
  }

  // 몬스터가 걸어올 길 (둥근 모서리)
  ctx.fillStyle = COLOR.path;
  ctx.beginPath(); ctx.roundRect(CASTLE_X + CASTLE_W - 20, PATH_Y, W, PATH_H, PATH_H / 2); ctx.fill();
  ctx.fillStyle = COLOR.pathDot;
  for (let x = CASTLE_X + CASTLE_W + 20; x < W; x += 55) {
    ctx.beginPath(); ctx.ellipse(x, PATH_Y + 18 + (x % 3) * 8, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  // 꽃 (살랑살랑)
  for (const f of state.flowers) {
    const sway = Math.sin(state.time * 2 + f.x * 0.05) * 0.15;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(sway);
    ctx.scale(f.s, f.s);
    ctx.strokeStyle = "#5fb36a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, 0); ctx.stroke();
    ctx.fillStyle = f.c;
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 5, Math.sin(a) * 5 - 2, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#ffcf3f";
    ctx.beginPath(); ctx.arc(0, -2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawCastle() {
  const x = CASTLE_X, w = CASTLE_W;
  const baseY = GROUND_Y + 62;
  // 숨쉬듯 말랑말랑 (아래 기준으로 살짝 늘었다 줄었다)
  const squish = 1 + Math.sin(state.time * 2.2) * 0.015;
  const pose = castlePose();      // 필살기 중 점프 위치/찌그러짐

  // 땅 그림자 (점프하면 작아짐)
  const air = Math.min(1, -pose.dy / 230);
  ctx.fillStyle = `rgba(0,0,0,${0.12 - air * 0.06})`;
  ctx.beginPath(); ctx.ellipse(x + w / 2 + pose.dx, baseY, w * 0.6 * (1 - air * 0.5), 10, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  if (state.hurtTimer > 0) ctx.translate(Math.sin(state.time * 80) * 5, 0);   // 맞으면 흔들
  ctx.translate(x + w / 2 + pose.dx, baseY + pose.dy);
  ctx.rotate(pose.rot);
  ctx.scale(pose.sx / squish, pose.sy * squish);
  ctx.translate(-(x + w / 2), -baseY);

  ctx.lineWidth = 4;
  ctx.strokeStyle = COLOR.outline;
  ctx.lineJoin = "round";

  // 본체
  const bodyTop = GROUND_Y - 120;
  ctx.fillStyle = COLOR.wall;
  ctx.beginPath(); ctx.roundRect(x, bodyTop, w, baseY - bodyTop, [22, 22, 10, 10]); ctx.fill(); ctx.stroke();
  // 아래쪽 음영
  ctx.fillStyle = COLOR.wallShade;
  ctx.beginPath(); ctx.roundRect(x + 4, baseY - 30, w - 8, 26, [0, 0, 8, 8]); ctx.fill();

  // 동글동글 성벽 톱니
  ctx.fillStyle = COLOR.wall;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.roundRect(x + 6 + i * 37, bodyTop - 20, 28, 28, 10); ctx.fill(); ctx.stroke();
  }
  ctx.fillRect(x + 2, bodyTop + 2, w - 4, 10); // 톱니와 본체 이음새 가리기

  // 탑
  const tx = x + 45, tw = 60, tTop = bodyTop - 75;
  ctx.fillStyle = COLOR.tower;
  ctx.beginPath(); ctx.roundRect(tx, tTop, tw, 80, [8, 8, 0, 0]); ctx.fill(); ctx.stroke();
  // 하트 창문
  drawHeart(tx + tw / 2, tTop + 38, 11, COLOR.roof);
  // 고깔 지붕
  ctx.fillStyle = COLOR.roof;
  ctx.beginPath();
  ctx.moveTo(tx - 10, tTop + 4);
  ctx.quadraticCurveTo(tx + tw / 2, tTop - 30, tx + tw / 2, tTop - 62);
  ctx.quadraticCurveTo(tx + tw / 2, tTop - 30, tx + tw + 10, tTop + 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 지붕 물방울 무늬
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  [[-12, -8], [10, -18], [0, -34]].forEach(([dx, dy]) => {
    ctx.beginPath(); ctx.arc(tx + tw / 2 + dx, tTop + dy, 3.5, 0, Math.PI * 2); ctx.fill();
  });

  // 하트 깃발 (팔랑팔랑)
  const poleTop = tTop - 95;
  ctx.beginPath(); ctx.moveTo(tx + tw / 2, tTop - 60); ctx.lineTo(tx + tw / 2, poleTop); ctx.stroke();
  ctx.fillStyle = "#ffe08a";
  const wave = Math.sin(state.time * 5) * 4;
  ctx.beginPath();
  ctx.moveTo(tx + tw / 2, poleTop);
  ctx.quadraticCurveTo(tx + tw / 2 + 18, poleTop - 4 + wave, tx + tw / 2 + 34, poleTop + 8 + wave * 0.5);
  ctx.quadraticCurveTo(tx + tw / 2 + 18, poleTop + 20 + wave, tx + tw / 2, poleTop + 22);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  drawHeart(tx + tw / 2 + 15, poleTop + 11 + wave * 0.6, 5, COLOR.roofDark);

  // 성 얼굴 (가끔 깜빡임)
  drawFace(x + w / 2, bodyTop + 45, 42, { blink: state.blinkTimer < 0, hurt: state.hurtTimer > 0, scary: pose.scary });

  // 성문 (아치)
  ctx.fillStyle = "#c98f6b";
  ctx.beginPath();
  ctx.moveTo(x + 52, baseY);
  ctx.lineTo(x + 52, baseY - 34);
  ctx.arc(x + w / 2, baseY - 34, 23, Math.PI, 0);
  ctx.lineTo(x + w - 52, baseY);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "rgba(122,75,92,0.4)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + w / 2, baseY - 56); ctx.lineTo(x + w / 2, baseY - 2); ctx.stroke();

  // 성벽 강화 단계에 따른 장식 (깃발 · 리본 · 왕관 …)
  drawCastleDeco(x, w, bodyTop, baseY, tx, tw, tTop);

  ctx.restore();
}

// =====================================================================
//  🏰 성 꾸미기 — 상점에서 '성벽 강화'를 살 때마다 장식이 하나씩 붙음
//   1단계 🚩 양쪽 깃발 → 2단계 🎀 리본 → 3단계 👑 왕관 → 4단계 💡 하트 전구 → 5단계~ ✨ 반짝반짝
// =====================================================================
const DECO = [
  { icon: "🚩", name: "깃발" },
  { icon: "🎀", name: "리본" },
  { icon: "👑", name: "왕관" },
  { icon: "💡", name: "하트 전구" },
  { icon: "✨", name: "반짝이" }
];

function drawCastleDeco(x, w, bodyTop, baseY, tx, tw, tTop) {
  const lv = state.wallLevel || 0;
  const t = state.time;
  if (lv <= 0) return;
  ctx.lineWidth = 3; ctx.strokeStyle = COLOR.outline; ctx.lineJoin = "round";

  // 1단계: 양쪽 성벽 위에 펄럭이는 깃발
  if (lv >= 1) {
    [[x + 20, "#7fd6c2"], [x + w - 20, "#c9a7ff"]].forEach(([px, color], i) => {
      const top = bodyTop - 62;
      ctx.beginPath(); ctx.moveTo(px, bodyTop - 18); ctx.lineTo(px, top); ctx.stroke();
      const wv = Math.sin(t * 6 + i * 2) * 4;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(px, top);
      ctx.quadraticCurveTo(px + 14, top + 2 + wv, px + 28, top + 9 + wv * 0.6);
      ctx.quadraticCurveTo(px + 14, top + 16 + wv, px, top + 18);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      drawStar(px + 11, top + 9 + wv * 0.4, 4, "#fff");
    });
  }

  // 2단계: 탑에 리본 띠 + 성 앞에 커다란 리본
  if (lv >= 2) {
    ctx.fillStyle = "#ff7aa8";
    ctx.fillRect(tx, tTop + 58, tw, 9);
    ctx.strokeRect(tx, tTop + 58, tw, 9);
    const bx = x + w / 2, by = bodyTop + 88;
    const flap = Math.sin(t * 3) * 0.08;
    // 리본 꼬리
    ctx.fillStyle = "#ff5c8a";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(bx, by + 2);
      ctx.lineTo(bx + s * 10, by + 26);
      ctx.lineTo(bx + s * 18, by + 20);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // 양쪽 고리
    ctx.fillStyle = "#ff7aa8";
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(s * flap);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(s * 10, -16, s * 30, -14, s * 26, 0);
      ctx.bezierCurveTo(s * 30, 12, s * 10, 14, 0, 0);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = "#ff4f8b";
    ctx.beginPath(); ctx.roundRect(bx - 6, by - 6, 12, 12, 4); ctx.fill(); ctx.stroke();
  }

  // 3단계: 지붕 꼭대기에 금빛 왕관 (보석 반짝)
  if (lv >= 3) {
    const cx = tx + tw / 2, cy = tTop - 52;
    ctx.save();
    ctx.shadowColor = "#ffd23a"; ctx.shadowBlur = 10 + Math.sin(t * 4) * 5;
    ctx.fillStyle = "#ffcf3f";
    ctx.beginPath();
    ctx.moveTo(cx - 22, cy + 10);
    ctx.lineTo(cx - 24, cy - 12);
    ctx.lineTo(cx - 11, cy - 2);
    ctx.lineTo(cx, cy - 20);
    ctx.lineTo(cx + 11, cy - 2);
    ctx.lineTo(cx + 24, cy - 12);
    ctx.lineTo(cx + 22, cy + 10);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.stroke();
    [[-24, -12], [0, -20], [24, -12]].forEach(([dx, dy]) => {
      ctx.fillStyle = "#fff4b0";
      ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle = "#ff5c8a"; ctx.beginPath(); ctx.arc(cx, cy + 3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#7fd6c2"; ctx.beginPath(); ctx.arc(cx - 12, cy + 4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c9a7ff"; ctx.beginPath(); ctx.arc(cx + 12, cy + 4, 3, 0, Math.PI * 2); ctx.fill();
    if (Math.sin(t * 3) > 0.6) drawStar(cx + 18, cy - 22, 5, "#fff");
  }

  // 4단계: 성벽을 따라 하트 전구 줄 (깜빡깜빡)
  if (lv >= 4) {
    const y0 = bodyTop + 6;
    ctx.strokeStyle = "rgba(122,75,92,0.6)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 4, y0);
    ctx.quadraticCurveTo(x + w / 2, y0 + 22, x + w - 4, y0);
    ctx.stroke();
    const colors = ["#ff5c8a", "#ffd23a", "#7fd6c2", "#c9a7ff"];
    for (let i = 0; i < 7; i++) {
      const k = (i + 0.5) / 7;
      const lx = x + 4 + (w - 8) * k;
      const ly = y0 + 22 * 4 * k * (1 - k) * 0.5 + 6;
      ctx.globalAlpha *= 0.55 + 0.45 * Math.max(0, Math.sin(t * 4 + i * 1.3));
      drawHeart(lx, ly, 5, colors[i % 4]);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = COLOR.outline;
  }

  // 5단계 이상: 성 주변에 금빛 반짝이가 맴돔 (단계가 오를수록 더 많이)
  if (lv >= 5) {
    const n = Math.min(12, 4 + (lv - 5) * 2);
    for (let i = 0; i < n; i++) {
      const a = t * 0.8 + i * (Math.PI * 2 / n);
      const sx = x + w / 2 + Math.cos(a) * 95;
      const sy = bodyTop + 30 + Math.sin(a) * 120;
      ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 5 + i);
      drawStar(sx, sy, 8, "#ffd23a");
      drawStar(sx, sy, 4, "#fff");
    }
    ctx.globalAlpha = 1;
  }
}


// =====================================================================
//  몬스터 그리기
// =====================================================================
function drawMonsters() {
  // 뒤(위쪽 줄)에 있는 몬스터부터 그려야 앞 몬스터가 위에 겹침
  const list = [...state.monsters].sort((a, b) => a.y - b.y);
  for (const m of list) {
    ctx.save();
    // 맞았을 때 부르르 떨림 + 번쩍
    const shake = m.hitFlash > 0 ? Math.sin(m.t * 90) * 4 : 0;
    ctx.translate(m.x + shake, m.y);
    if (m.escaping) {                    // 얼음 정령 도망: 빙글 돌며 하늘로
      const k = m.dying / 0.7;
      ctx.globalAlpha = k;
      ctx.translate((1 - k) * 160, -(1 - k) * 230);   // 성 앞에서 오른쪽 위로 휙
      ctx.rotate((1 - k) * Math.PI * 2);
    } else if (m.dying) {                // 처치: 커지면서 사라짐
      const k = m.dying / 0.4;
      ctx.globalAlpha = k;
      ctx.scale(1 + (1 - k) * 0.5, 1 - (1 - k) * 0.6);
    }
    if (m.hitFlash > 0) ctx.filter = "brightness(2.2)";
    if (m.type === "normal") drawSlime(m);
    else if (m.type === "fast") drawWraith(m);
    else if (m.type === "ice") drawIceSpirit(m);
    else drawGolem(m);
    ctx.filter = "none";
    ctx.restore();
  }
  // 단어 라벨은 몬스터를 다 그린 뒤 맨 위에
  for (const m of list) if (!m.dying) drawLabel(m);
}

// --- 일반: 귀여운 보라 슬라임 (방심 유도용) ---
function drawSlime(m) {
  const sq = Math.sin(m.t * 6) * 0.08;
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.scale(1 + sq, 1 - sq);
  ctx.fillStyle = "#c3a6ff";
  ctx.strokeStyle = COLOR.outline; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-24, 0);
  ctx.quadraticCurveTo(-26, -38, 0, -40);
  ctx.quadraticCurveTo(26, -38, 24, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.beginPath(); ctx.ellipse(-10, -28, 5, 8, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  drawFace(0, -18, 22, {});
}

// --- 빠른 몬스터: 그림자 망령 (잔상 + 빨간 눈 + 이빨) ---
function drawWraith(m) {
  const t = m.t;
  // 질주 잔상
  for (let i = 3; i >= 1; i--) {
    ctx.save();
    ctx.globalAlpha *= 0.12 * (4 - i);
    ctx.translate(i * 18, 0);
    wraithBody(t - i * 0.03, false);
    ctx.restore();
  }
  // 속도선
  ctx.strokeStyle = "rgba(60,20,70,0.35)"; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const yy = -50 + i * 16, off = (t * 400 + i * 50) % 60;
    ctx.beginPath(); ctx.moveTo(30 + off, yy); ctx.lineTo(70 + off, yy); ctx.stroke();
  }
  wraithBody(t, true);
}

function wraithBody(t, detail) {
  // 그림자
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(0, 0, 28, 6, 0, 0, Math.PI * 2); ctx.fill();

  // 다리 (발톱으로 다다닥)
  ctx.strokeStyle = "#140a1c"; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (let i = 0; i < 4; i++) {
    const ph = Math.sin(t * 30 + i * Math.PI / 2) * 8;
    const lx = -14 + i * 9;
    ctx.beginPath(); ctx.moveTo(lx, -16); ctx.lineTo(lx - 6 + ph, -6); ctx.lineTo(lx - 10 + ph, 0); ctx.stroke();
  }

  // 몸통: 일렁이는 어둠 덩어리 + 뒤로 흩날리는 꼬리
  ctx.save();
  if (detail) { ctx.shadowColor = "rgba(140, 40, 200, 0.8)"; ctx.shadowBlur = 18; }
  const g = ctx.createLinearGradient(-30, -60, 40, 0);
  g.addColorStop(0, "#2a1238"); g.addColorStop(1, "#07030b");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-34, -30);
  ctx.quadraticCurveTo(-30, -58, -6, -58);           // 머리 위
  for (let i = 0; i < 5; i++) {                       // 뒤로 찢어진 꼬리 갈퀴
    const fl = Math.sin(t * 18 + i * 1.7) * 6;
    ctx.lineTo(28 + i * 7 + fl, -54 + i * 9);
    ctx.lineTo(10 + i * 4, -46 + i * 9);
  }
  ctx.quadraticCurveTo(0, -12, -20, -14);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  if (!detail) return;

  // 뿔
  ctx.fillStyle = "#07030b";
  ctx.beginPath(); ctx.moveTo(-20, -54); ctx.lineTo(-30, -74); ctx.lineTo(-12, -57); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, -57); ctx.lineTo(-4, -76); ctx.lineTo(4, -55); ctx.fill();

  // 빛나는 빨간 눈 (찢어진 모양)
  ctx.save();
  ctx.shadowColor = "#ff1a1a"; ctx.shadowBlur = 14;
  ctx.fillStyle = "#ff3030";
  const flick = 0.7 + Math.random() * 0.3;
  ctx.globalAlpha *= flick;
  ctx.beginPath(); ctx.moveTo(-30, -42); ctx.lineTo(-18, -38); ctx.lineTo(-28, -36); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14, -44); ctx.lineTo(-2, -42); ctx.lineTo(-12, -38); ctx.fill();
  ctx.restore();

  // 귀까지 찢어진 입 + 톱니 이빨
  ctx.fillStyle = "#4a0010";
  ctx.beginPath();
  ctx.moveTo(-34, -30);
  ctx.quadraticCurveTo(-18, -16, 4, -30);
  ctx.quadraticCurveTo(-16, -24, -34, -30);
  ctx.fill();
  ctx.fillStyle = "#f4efe6";
  for (let i = 0; i < 6; i++) {
    const tx = -31 + i * 6;
    ctx.beginPath(); ctx.moveTo(tx, -29 + i * 0.3); ctx.lineTo(tx + 3, -22); ctx.lineTo(tx + 6, -29); ctx.fill();
  }
}

// --- 탱커: 용암 골렘 (거대, 쿵쿵, 갈라진 용암 틈) ---
function drawGolem(m) {
  const t = m.t;
  const stomp = Math.abs(Math.sin(t * 3));
  const bob = -stomp * 5;
  const damaged = m.idx >= 1;

  // 발밑 붉은 기운
  const aura = ctx.createRadialGradient(0, 0, 5, 0, 0, 70);
  aura.addColorStop(0, "rgba(255, 60, 0, 0.35)");
  aura.addColorStop(1, "rgba(255, 60, 0, 0)");
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.ellipse(0, 0, 70, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(0, 0, 44 - stomp * 4, 9, 0, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = "#120a0c"; ctx.lineWidth = 4; ctx.lineJoin = "round";
  const stone = ctx.createLinearGradient(0, -130, 0, 0);
  stone.addColorStop(0, "#5a4f57"); stone.addColorStop(1, "#2b2328");

  // 다리 (번갈아 쿵쿵)
  ctx.fillStyle = stone;
  const legL = Math.sin(t * 3) * 4, legR = -legL;
  ctx.beginPath(); ctx.roundRect(-30, -34 + legL, 24, 34 - legL, 6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(6, -34 + legR, 24, 34 - legR, 6); ctx.fill(); ctx.stroke();

  ctx.save();
  ctx.translate(0, bob);

  // 거대한 팔 + 주먹
  const swing = Math.sin(t * 3) * 0.15;
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 44, -96);
    ctx.rotate(side * swing);
    ctx.fillStyle = stone;
    ctx.beginPath(); ctx.roundRect(-12, 0, 24, 46, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-17, 40, 34, 30, 10); ctx.fill(); ctx.stroke();   // 주먹
    ctx.fillStyle = "#8d8790";                                                      // 주먹 징
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-11 + i * 11, 70); ctx.lineTo(-6 + i * 11, 80); ctx.lineTo(-1 + i * 11, 70); ctx.fill();
    }
    ctx.restore();
  }

  // 몸통
  ctx.fillStyle = stone;
  ctx.beginPath(); ctx.roundRect(-38, -112, 76, 82, 14); ctx.fill(); ctx.stroke();

  // 어깨 가시
  ctx.fillStyle = "#9a939c";
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const bx = side * (30 + i * 8);
      ctx.beginPath();
      ctx.moveTo(bx - 6, -108 + i * 6);
      ctx.lineTo(bx + side * 8, -132 + i * 8);
      ctx.lineTo(bx + 6, -106 + i * 6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // 용암 균열 (맥박처럼 밝아졌다 어두워짐)
  const pulse = 0.6 + Math.sin(t * 5) * 0.4;
  ctx.save();
  ctx.shadowColor = "#ff5a00"; ctx.shadowBlur = 12 * pulse;
  ctx.strokeStyle = `rgba(255, ${120 + pulse * 80}, 30, ${0.7 + pulse * 0.3})`;
  ctx.lineWidth = 3;
  const cracks = [
    [[-20, -100], [-10, -84], [-18, -70], [-6, -52]],
    [[22, -104], [12, -90], [20, -76]],
    [[-4, -46], [8, -40], [2, -32]]
  ];
  if (damaged) cracks.push([[-36, -60], [-14, -64], [4, -58], [18, -66], [36, -56]],
                           [[0, -110], [-4, -96], [6, -84]]);
  for (const c of cracks) {
    ctx.beginPath(); c.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  }
  ctx.restore();

  // 머리
  ctx.fillStyle = stone;
  ctx.beginPath(); ctx.roundRect(-24, -140, 48, 34, 8); ctx.fill(); ctx.stroke();
  // 뿔 (데미지 입으면 한쪽 부러짐)
  ctx.fillStyle = "#d8d0c4";
  ctx.beginPath(); ctx.moveTo(-20, -136); ctx.quadraticCurveTo(-40, -150, -34, -172); ctx.quadraticCurveTo(-28, -152, -10, -140); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (damaged) {
    ctx.beginPath(); ctx.moveTo(20, -136); ctx.lineTo(30, -150); ctx.lineTo(24, -154); ctx.lineTo(10, -140); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(20, -136); ctx.quadraticCurveTo(40, -150, 34, -172); ctx.quadraticCurveTo(28, -152, 10, -140); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 성난 눈썹
  ctx.strokeStyle = "#120a0c"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-18, -134); ctx.lineTo(-4, -126); ctx.moveTo(18, -134); ctx.lineTo(4, -126); ctx.stroke();
  // 이글거리는 눈
  ctx.save();
  ctx.shadowColor = "#ffb000"; ctx.shadowBlur = 16;
  ctx.fillStyle = "#ffd23a";
  ctx.beginPath(); ctx.moveTo(-17, -126); ctx.lineTo(-5, -122); ctx.lineTo(-15, -119); ctx.fill();
  ctx.beginPath(); ctx.moveTo(17, -126); ctx.lineTo(5, -122); ctx.lineTo(15, -119); ctx.fill();
  ctx.restore();
  // 아래턱 송곳니
  ctx.fillStyle = "#e9e1d3"; ctx.strokeStyle = "#120a0c"; ctx.lineWidth = 2;
  for (const fx of [-12, 12]) {
    ctx.beginPath(); ctx.moveTo(fx - 4, -106); ctx.lineTo(fx, -118); ctx.lineTo(fx + 4, -106); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
